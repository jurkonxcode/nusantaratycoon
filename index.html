<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d4f">
  <title>Nusantara Tycoon</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="batik-strip" aria-hidden="true"></div>

  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">🏝️</span>
        <div>
          <h1>Nusantara Tycoon</h1>
          <p id="rank-name">Desa Rintisan</p>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><span>Kas</span><b id="stat-cash">Rp 0</b></div>
        <div class="stat"><span>Peradaban</span><b id="stat-score">0</b></div>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab" data-action="tab" data-id="map" role="tab">🗺️ Peta</button>
      <button class="tab" data-action="tab" data-id="market" role="tab">⚖️ Pasar</button>
      <button class="tab" data-action="tab" data-id="about" role="tab">ℹ️ Info</button>
    </nav>

    <main>
      <section id="tab-map" class="tab-panel">
        <div class="map-card">
          <div id="map"></div>
        </div>
        <button class="btn primary wide collect-all" data-action="collect-all">📦 Kumpulkan semua hasil</button>
        <div id="region-panel"></div>
      </section>
      <section id="tab-market" class="tab-panel"></section>
      <section id="tab-about" class="tab-panel"></section>
    </main>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/config.js"></script>
  <script src="js/data/commodities.js"></script>
  <script src="js/data/buildings.js"></script>
  <script src="js/data/regions.js"></script>
  <script src="js/core/format.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/economy.js"></script>
  <script src="js/storage/local-storage.js"></script>
  <script src="js/storage/supabase-storage.js"></script>
  <script src="js/storage/index.js"></script>
  <script src="js/ui/toast.js"></script>
  <script src="js/ui/map.js"></script>
  <script src="js/ui/panels.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
