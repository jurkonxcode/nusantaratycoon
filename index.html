<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d4f">
  <title>Nusantara Tycoon</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="description" content="Bangun kerajaan dagang dari Sabang sampai Merauke.">
  <meta property="og:title" content="Nusantara Tycoon">
  <meta property="og:description" content="Bangun kerajaan dagang dari Sabang sampai Merauke.">
  <meta property="og:image" content="assets/social/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="batik-strip" aria-hidden="true"></div>

  <header class="masthead">
    <div class="wrap">
      <div class="topbar">
        <div class="brand">
          <img class="brand-logo" src="assets/logo/logo-mark.svg" alt="" width="40" height="40">
          <div>
            <h1>Nusantara Tycoon</h1>
            <p id="rank-name">Desa Rintisan</p>
          </div>
        </div>
        <div class="stats">
          <div class="stat"><span>Kas</span><b id="stat-cash">Rp 0</b></div>
          <div class="stat term-stat" data-action="term" data-term="peradaban" role="button" tabindex="0"><span>Peradaban</span><b id="stat-score">0</b></div>
        </div>
      </div>

      <nav class="tabs" role="tablist">
        <button class="tab" data-action="tab" data-id="map" role="tab">🗺️ Peta</button>
        <button class="tab" data-action="tab" data-id="market" role="tab">⚖️ Pasar</button>
        <button class="tab" data-action="tab" data-id="stats" role="tab">🏆 Capaian</button>
        <button class="tab" data-action="tab" data-id="about" role="tab">ℹ️ Info</button>
        <button class="tab mini" data-action="tab" data-id="settings" role="tab" aria-label="Pengaturan" title="Pengaturan">⚙️</button>
      </nav>
    </div>
  </header>

  <div id="app" class="wrap">
    <main>
      <section id="tab-map" class="tab-panel">
        <div class="map-layout">
          <div class="map-col">
          <div id="guide"></div>
          <div class="info-row">
          <div class="goal" id="goal">
            <div class="goal-top">
              <span class="goal-ico" id="goal-ico">🎯</span>
              <div class="goal-text"><small>Target berikutnya</small><b id="goal-title">…</b></div>
              <div class="builders" id="builders" title="Tukang yang sedang bekerja"></div>
            </div>
            <div class="bar goalbar"><i id="goal-bar"></i></div>
            <small id="goal-eta"></small>
          </div>
          <div id="world-banner" class="world-banner"></div>
        </div>
            <div class="map-card">
              <div class="map-scroll"><div id="map"></div></div>
              <div id="region-chips" class="region-chips"></div>
            </div>
          </div>
          <div class="side-col">
            <button class="btn primary wide collect-all" data-action="collect-all">📦 Kumpulkan semua hasil</button>
            <button class="btn wide cheapest" data-action="cheapest" data-cost="0"><span data-live="cheapest-label">⬆ Upgrade termurah</span></button>
            <div id="sheet" class="sheet">
              <div class="sheet-box" id="sheet-box">
                <div class="sheet-grab" id="sheet-grab" data-action="sheet-close" role="button" tabindex="0" aria-label="Tutup panel wilayah">
                  <i class="sheet-bar" aria-hidden="true"></i>
                  <span class="sheet-title" id="sheet-title"></span>
                  <b class="sheet-x" aria-hidden="true">✕</b>
                </div>
                <div id="region-panel"></div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section id="tab-market" class="tab-panel"></section>
      <section id="tab-stats" class="tab-panel"></section>
      <section id="tab-about" class="tab-panel"></section>
      <section id="tab-settings" class="tab-panel"></section>
    </main>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/config.js"></script>
  <script src="js/data/commodities.js"></script>
  <script src="js/data/events.js"></script>
  <script src="js/data/buildings.js"></script>
  <script src="js/data/regions.js"></script>
  <script src="js/data/exports.js"></script>
  <script src="js/data/geo.js"></script>
  <script src="js/core/format.js"></script>
  <script src="js/core/world.js"></script>
  <script src="js/core/raster.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/economy.js"></script>
  <script src="js/core/achievements.js"></script>
  <script src="js/storage/local-storage.js"></script>
  <script src="js/storage/supabase-storage.js"></script>
  <script src="js/storage/index.js"></script>
  <script src="js/ui/toast.js"></script>
  <script src="js/ui/fx.js"></script>
  <script src="js/ui/settings.js"></script>
  <script src="js/ui/assets.js"></script>
  <script src="js/ui/sprites.js"></script>
  <script src="js/ui/terrain.js"></script>
  <script src="js/ui/map.js"></script>
  <script src="js/ui/panels.js"></script>
  <script src="js/ui/welcome.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
