  /* ---------- Tab capaian: statistik, pencapaian, log ---------- */

  function ago(ms) {
    if (ms < 45000) return 'baru saja';
    return F.duration(ms) + ' lalu';
  }

  function renderStats(state, now) {
    const st = state.stats || {};
    const A = NT.achievements;
    const opened = Object.keys(state.regions).filter(function (id) { return state.regions[id].unlocked; }).length;
    const total = Object.keys(state.regions).length;
    const tiles = [
      ['💰', 'Total pendapatan', F.money(state.totalEarned)],
      ['📦', 'Hasil dikumpulkan', F.num(st.produced || 0)],
      ['🤝', 'Barang terjual', F.num(st.sold || 0)],
      ['💎', 'Penjualan terbesar', F.money(st.bestSale || 0)],
      ['🔨', 'Pembangunan', F.num((st.builds || 0) + (st.upgrades || 0))],
      ['🗺️', 'Wilayah terbuka', opened + ' dari ' + total],
      ['⏱️', 'Waktu bermain', '<span data-live="playtime"></span>'],
      ['📅', 'Mulai bermain', new Date(state.createdAt).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })]
    ].map(function (t) {
      return '<div class="tile"><span class="tile-ico">' + t[0] + '</span><small>' + t[1] + '</small><b>' + t[2] + '</b></div>';
    }).join('');

    const got = A.list.filter(function (a) { return state.achievements[a.id]; });
    const badges = A.list.map(function (a) {
      const t = state.achievements[a.id];
      return '<div class="badge' + (t ? ' got' : '') + '" title="' + a.desc + '">' +
        '<span class="badge-ico">' + (t ? a.icon : '🔒') + '</span><b>' + a.name + '</b><small>' + a.desc + '</small></div>';
    }).join('');

    const log = (state.log || []).slice().reverse().map(function (e) {
      return '<li><span class="log-ico">' + e.i + '</span><span class="log-x">' + e.x + '</span><small>' + ago(now - e.t) + '</small></li>';
    }).join('');

    $('tab-stats').innerHTML =
      '<div class="card"><h2>Statistik</h2><div class="tiles">' + tiles + '</div></div>' +
      '<div class="card"><h2>Pencapaian <span class="count">' + got.length + '/' + A.list.length + '</span></h2>' +
        '<div class="bar"><i style="width:' + got.length / A.list.length * 100 + '%"></i></div>' +
        '<div class="badges">' + badges + '</div></div>' +
      '<div class="card"><h2>Aktivitas terbaru</h2>' +
        (log ? '<ul class="log">' + log + '</ul>' : '<p class="muted">Belum ada aktivitas. Mulailah berdagang!</p>') + '</div>';
  }

  /* ---------- Tab info ---------- */

  // Kalender panen 12 bulan untuk satu komoditas (hijau = panen raya, merah = paceklik).
  function calendar(cid, now) {
    const cur = NT.world.monthOf(now);
    const t = D.commodities[cid].season.prod;
    const mean = t.reduce(function (a, b) { return a + b; }, 0) / t.length;
    const boxes = t.map(function (v, i) {
      const r = v / mean;
      return '<i class="' + (r >= 1.2 ? 'hi' : (r <= 0.8 ? 'lo' : '')) + (i === cur ? ' now' : '') + '" title="' + NT.world.MONTHS[i] + '"></i>';
    }).join('');
    return '<div class="cal">' + boxes + '</div>';
  }

  function worldCard() {
    const now = Date.now();
    const labels = 'JFMAMJJASOND'.split('').map(function (c) { return '<span>' + c + '</span>'; }).join('');
    const rows = Object.keys(D.commodities).map(function (cid) {
      const c = D.commodities[cid];
      return '<div><b>' + (NT.ui.art.comm(c.id, 'sm') || c.icon) + ' ' + c.name + '</b>' + calendar(cid, now) +
        '<div class="cal-labels">' + labels + '</div><small class="muted">' + c.seasonNote + '</small></div>';
    }).join('');
    return '<div class="card"><h2>Dunia nyata</h2>' +
      '<p class="muted small">Musim mengikuti kalender sungguhan (WIB). Saat panen raya hasil berlimpah tapi harga tertekan; saat paceklik sebaliknya. ' +
      'Peristiwa seperti banjir atau El Niño bergantian tiap ' + NT.config.eventSlotHours + ' jam dan sama untuk semua pemain. ' +
      'Harga dasar mengikuti rasio harga nyata (perkiraan kasar), dan ongkir mengikuti jarak laut antar kota pelabuhan.</p>' +
      '<div data-live="world-now"></div>' + rows + '</div>';
  }

  function renderAbout(state) {
    const driver = NT.getStorage();
    const roadmap = [
      [true, 'Produksi berbasis waktu (jalan walau offline)'],
      [true, 'Pasar dengan harga dinamis; ongkir dari berat dan jarak laut nyata'],
      [true, 'Musim panen dan peristiwa dunia nyata (banjir, El Niño, lonjakan ekspor)'],
      [true, 'Peta pixel art dengan bentuk pulau mengikuti bujur/lintang nyata'],
      [true, 'Infrastruktur: tol dan pelabuhan'],
      [false, 'Login dan simpan di Supabase'],
      [false, 'Pasar bersama antar-pemain'],
      [false, 'Proyek nasional dan aliansi'],
      [false, 'Wilayah lain: Kalimantan, Bali & Nusa Tenggara, Maluku, Papua']
    ].map(function (x) { return '<li>' + (x[0] ? '✅' : '⬜') + ' ' + x[1] + '</li>'; }).join('');

    $('tab-about').innerHTML =
      '<div class="card"><h2>Cara bermain</h2><ol class="plain">' +
        '<li>Kumpulkan hasil dari sawah dan kebunmu di tab <b>Peta</b>.</li>' +
        '<li>Jual di tab <b>Pasar</b>. Cari pasar dengan harga bersih terbaik.</li>' +
        '<li>Naikkan level bangunan, bangun tol dan pelabuhan.</li>' +
        '<li>Buka wilayah baru untuk komoditas dan pasar baru.</li></ol></div>' +
      worldCard() +
      '<div class="card"><h2>Gelar peradaban</h2><p><b data-live="rank-big"></b></p>' +
        '<div class="bar"><i data-live="rank-bar"></i></div><small class="muted" data-live="rank-next"></small></div>' +
      '<div class="card"><h2>Rencana pengembangan</h2><ul class="plain">' + roadmap + '</ul></div>';
  }

  /* ---------- Tab pengaturan ---------- */

  function setRow(title, desc, control) {
    return '<div class="set-row"><div class="set-text"><b>' + title + '</b><small>' + desc + '</small></div>' +
      '<div class="set-ctl">' + control + '</div></div>';
  }

  function toggle(key, on, label) {
    return '<button class="switch' + (on ? ' on' : '') + '" role="switch" aria-checked="' + on + '" aria-label="' + label + '" ' +
      'data-action="setting" data-key="' + key + '" data-value="' + (!on) + '"><i></i></button>';
  }

  function choice(key, current) {
    return '<div class="segs mini" role="group">' + NT.ui.settings.options[key].map(function (o) {
      return '<button class="seg' + (o[0] === current ? ' on' : '') + '" aria-pressed="' + (o[0] === current) + '" ' +
        'data-action="setting" data-key="' + key + '" data-value="' + o[0] + '">' + o[1] + '</button>';
    }).join('') + '</div>';
  }

  function renderSettings() {
    const S = NT.ui.settings;
    const driver = NT.getStorage();
    const focused = document.activeElement && document.activeElement.closest && document.activeElement.closest('#tab-settings');
    const keep = focused ? [document.activeElement.getAttribute('data-key'), document.activeElement.getAttribute('data-value')] : null;

    const reset = view.resetArmed
      ? '<div class="reset-confirm"><p><b>Hapus semua kemajuan?</b> Ini tidak bisa dibatalkan. Ekspor dulu bila ingin menyimpan cadangan.</p>' +
        '<div class="set-buttons"><button class="btn danger" data-action="reset">Ya, hapus semuanya</button>' +
        '<button class="btn" data-action="reset-cancel">Batal</button></div></div>'
      : '<button class="btn danger" data-action="reset-ask">Mulai ulang game</button>';

    $('tab-settings').innerHTML =
      '<div class="card set-card"><h2>Suara</h2>' +
        setRow('Efek suara', 'Bunyi saat mengumpulkan, menjual, dan membangun.', toggle('sfx', S.get('sfx'), 'Efek suara')) +
        setRow('Volume', 'Seberapa keras efek suara terdengar.', choice('volume', S.get('volume'))) +
      '</div>' +
      '<div class="card set-card"><h2>Tampilan</h2>' +
        setRow('Ukuran teks', 'Perbesar tulisan dan tombol agar lebih mudah dibaca.', choice('textSize', S.get('textSize'))) +
        setRow('Hemat animasi', 'Matikan gerakan, konfeti, dan kapal di peta. Cocok untuk HP yang berat.', toggle('calm', S.get('calm'), 'Hemat animasi')) +
      '</div>' +
      '<div class="card set-card"><h2>Permainan</h2>' +
        setRow('Konfirmasi pembelian mahal', 'Tanya dulu sebelum membangun atau membuka wilayah yang menghabiskan sebagian besar kas.', choice('confirm', S.get('confirm'))) +
        setRow('Angka ringkas', 'Tampilkan 1,2 jt, bukan 1.200.000.', toggle('compact', S.get('compact'), 'Angka ringkas')) +
      '</div>' +
      '<div class="card set-card"><h2>Data</h2>' +
        setRow('Penyimpanan', driver.label + '.', '') +
        setRow('Cadangan', 'Simpan kemajuanmu ke file, atau pulihkan dari file cadangan.',
          '<div class="set-buttons"><button class="btn" data-action="export">Ekspor</button>' +
          '<label class="btn" for="import-file">Impor</label>' +
          '<input type="file" id="import-file" accept=".json,application/json" hidden></div>') +
        '<div class="set-row set-danger">' + reset + '</div>' +
      '</div>' +
      '<div class="card set-card"><h2>Bantuan</h2>' +
        setRow('Cara bermain', 'Panduan singkat, kalender panen, dan rencana pengembangan ada di tab Info.',
          '<button class="btn" data-action="tab" data-id="about">Buka Info</button>') +
        setRow('Panduan awal', 'Tampilkan lagi daftar langkah pertama di tab Peta (bila belum selesai).',
          '<button class="btn" data-action="guide-show">Tampilkan</button>') +
      '</div>';

    if (keep) {
      const sel = '#tab-settings [data-key="' + keep[0] + '"][data-value="' + keep[1] + '"]';
      const next = document.querySelector(sel) || document.querySelector('#tab-settings [data-key="' + keep[0] + '"]');
      if (next) next.focus();
    }
  }

  /* ---------- Chip wilayah ---------- */

  // Ikon wilayah: ilustrasi komoditas utama bila tersedia, kalau tidak emoji.
  function regionArt(r) { return (r.artIcon && NT.ui.art.comm(r.artIcon, 'sm')) || r.icon; }
  function regionIco(r, unlocked) {
    if (r.comingSoon) return '…';
    if (!unlocked) return '🔒';
    return (r.artIcon && NT.ui.art.comm(r.artIcon, 'sm')) || r.icon;
  }

  function renderChips(state) {
    const host = $('region-chips');
    if (!host) return;
    host.innerHTML = Object.keys(D.regions).map(function (id) {
      const r = D.regions[id];
      const unlocked = state.regions[id] && state.regions[id].unlocked;
      return '<button class="chip' + (id === view.region ? ' on' : '') + (r.comingSoon ? ' soon' : '') + '" data-action="pick-region" data-id="' + id + '">' +
        regionIco(r, unlocked) + ' ' + (r.short || r.name) + '</button>';
    }).join('');
  }

  /* ---------- Banner dunia nyata ---------- */

  let bannerCache = '';
  function worldHtml(now) {
    const W = NT.world;
    const cl = W.climate(now);
    const ev = W.activeEvent(now);
    let html = '<span>' + cl.icon + ' ' + cl.name + ' · ' + W.MONTHS[W.monthOf(now)] + '</span>';
    if (ev) {
      const good = Object.keys(ev.event.price || {}).some(function (k) { return ev.event.price[k] > 1; }) &&
        !Object.keys(ev.event.prod || {}).some(function (k) {
          return Object.keys(ev.event.prod[k]).some(function (x) { return ev.event.prod[k][x] < 1; });
        });
      html += '<span class="evt' + (good ? ' good' : '') + '">' + ev.event.icon + ' ' + ev.event.name + ': ' + ev.event.desc +
        ' <span class="muted-light">(sisa ' + F.duration(ev.endsAt - now) + ')</span></span>';
    }
    return html;
  }

  function multText(m) {
    if (Math.abs(m - 1) < 0.03) return '';
    return '<span class="mult ' + (m > 1 ? 'up' : 'down') + '">' + (m > 1 ? '▲ ' : '▼ ') + 'x' + F.num(m, 2) + '</span>';
  }

  /* ---------- Render dan tick ---------- */

  function renderAll(state, now) {
    document.querySelectorAll('.tab').forEach(function (t) {
      t.classList.toggle('on', t.getAttribute('data-id') === view.tab);
    });
    document.querySelectorAll('.tab-panel').forEach(function (p) {
      p.classList.toggle('on', p.id === 'tab-' + view.tab);
    });
    NT.ui.map.update(state, view.region);
    renderChips(state);
    renderRegion(state, now);
    $('sheet-title').innerHTML = regionArt(D.regions[view.region]) + ' ' + D.regions[view.region].name;
    $('sheet').classList.toggle('open', !!view.sheet);
    document.body.classList.toggle('sheet-open', !!view.sheet && view.tab === 'map');
    renderMarket(state, now);
    renderGuide(state);
    renderStats(state, now);
    renderAbout(state);
    renderSettings();
    tick(state, now);
  }

  function each(selector, fn) {
    document.querySelectorAll(selector).forEach(fn);
  }

  function tick(state, now) {
    const sc = E.score(state);
    const rk = E.rank(sc);
    NT.ui.fx.setCash($('stat-cash'), state.cash);
    $('stat-score').textContent = F.num(sc);
    $('rank-name').textContent = rk.current.name;

    const wh = worldHtml(now);
    if (wh !== bannerCache) {
      bannerCache = wh;
      $('world-banner').innerHTML = wh;
      each('[data-live="world-now"]', function (el) { el.innerHTML = '<p>' + wh + '</p>'; });
    }

    // Timer pembangunan
    each('[data-live="jobbar"]', function (el) {
      const j = E.jobFor(state, el.getAttribute('data-key'));
      if (j) el.style.width = Math.max(0, Math.min(100, (now - j.startedAt) / (j.endsAt - j.startedAt) * 100)) + '%';
    });
    each('[data-live="jobtime"]', function (el) {
      const j = E.jobFor(state, el.getAttribute('data-key'));
      if (j) el.textContent = F.clock(j.endsAt - now);
    });
    each('[data-live="speedcost"]', function (el) {
      const j = E.jobFor(state, el.getAttribute('data-key'));
      if (!j) return;
      const c = E.speedupCost(j, now);
      el.textContent = F.money(c);
      el.parentNode.setAttribute('data-cost', c);
    });

    // Timer pengiriman
    each('[data-live="shipbar"]', function (el) {
      const x = (state.shipments || []).filter(function (y) { return y.id === el.getAttribute('data-id'); })[0];
      if (x) el.style.width = Math.max(0, Math.min(100, (now - x.startedAt) / (x.endsAt - x.startedAt) * 100)) + '%';
    });
    each('[data-live="shiptime"]', function (el) {
      const x = (state.shipments || []).filter(function (y) { return y.id === el.getAttribute('data-id'); })[0];
      if (x) el.textContent = F.clock(x.endsAt - now);
    });

    // Kartu target berikutnya dan jumlah tukang
    const goal = E.nextGoal(state);
    if (goal) {
      $('goal-ico').innerHTML = (goal.kind === 'building' || goal.kind === 'infra') ? (NT.ui.art.sprite(goal.id, 'sm') || goal.icon) : goal.icon;
      $('goal-title').textContent = goal.label + ' · ' + F.money(goal.cost);
      $('goal-bar').style.width = Math.min(100, state.cash / goal.cost * 100) + '%';
      const inc = E.incomePerMin(state, now);
      $('goal-eta').textContent = state.cash >= goal.cost ? '✅ Kas cukup, ayo bangun!'
        : (inc > 0 ? '≈ ' + F.duration((goal.cost - state.cash) / inc * 60000) + ' lagi jika semua hasil dijual' : '');
    } else {
      $('goal-title').textContent = 'Semua target tercapai';
    }
    const busy = (state.jobs || []).length;
    $('builders').textContent = '🔨 ' + busy + '/' + NT.config.maxBuilders;
    $('builders').classList.toggle('busy', busy >= NT.config.maxBuilders);

    // Tombol Kumpulkan berdenyut bila gudang sudah separuh penuh
    let anyReady = false;
    each('[data-action="collect"]', function (el) {
      const id = el.getAttribute('data-id');
      const ready = E.pending(state, id, now) >= Math.max(1, E.capacity(state, id, now) * 0.5);
      el.classList.toggle('ready', ready);
      anyReady = anyReady || ready;
    });
    Object.keys(state.buildings).forEach(function (id) {
      if (E.pending(state, id, now) >= Math.max(1, E.capacity(state, id, now) * 0.5)) anyReady = true;
    });
    const all = document.querySelector('.collect-all');
    if (all) all.classList.toggle('ready', anyReady);
    NT.ui.map.tickJobs(state, now);

    // Tombol berbiaya: nonaktif bila kas kurang
    each('[data-cost]', function (el) {
      el.disabled = state.cash < Number(el.getAttribute('data-cost'));
    });

    each('[data-live="pending"]', function (el) {
      el.textContent = F.num(Math.floor(E.pending(state, el.getAttribute('data-id'), now)));
    });
    each('[data-live="bmult"]', function (el) {
      el.innerHTML = multText(E.worldProdMult(el.getAttribute('data-id'), now));
    });
    each('[data-live="bar"]', function (el) {
      const id = el.getAttribute('data-id');
      const cap = E.capacity(state, id, now) || 1;
      el.style.width = Math.min(100, E.pending(state, id, now) / cap * 100) + '%';
      el.parentNode.classList.toggle('full', E.pending(state, id, now) >= cap);
    });

    // Pasar
    each('[data-live="stock"]', function (el) {
      el.textContent = F.num(state.inventory[el.getAttribute('data-c')] || 0);
    });
    each('[data-live="unit"]', function (el) {
      el.textContent = F.price(E.currentPrice(state, view.market, el.getAttribute('data-c'), now));
    });
    each('[data-live="ship"]', function (el) {
      const s = E.shippingPerUnit(state, el.getAttribute('data-c'), view.market);
      el.textContent = s ? F.price(s) : 'Rp 0';
    });
    each('[data-live="season"]', function (el) {
      const tag = NT.world.harvestTag(el.getAttribute('data-c'), now);
      const html = tag ? '<button type="button" class="tag term-tag ' + tag.id + '" data-action="term" data-term="' + tag.id + '">' + tag.text + '</button>' : '';
      if (el.__h !== html) { el.__h = html; el.innerHTML = html; }
    });
    each('[data-live="km"]', function (el) {
      const km = E.distanceKm(D.commodities[el.getAttribute('data-c')].region, view.market);
      el.textContent = km ? '(' + F.num(Math.round(km / 10) * 10) + ' km)' : '';
    });
    each('[data-live="trend"]', function (el) {
      const cid = el.getAttribute('data-c');
      const ratio = E.currentPrice(state, view.market, cid, now) / E.normalPrice(view.market, cid) - 1;
      const pct = Math.round(ratio * 100);
      el.textContent = (pct >= 0 ? '▲ ' : '▼ ') + Math.abs(pct) + '%';
      el.className = 'trend ' + (pct >= 0 ? 'up' : 'down');
    });
    each('[data-live="best"]', function (el) {
      const cid = el.getAttribute('data-c');
      const best = E.bestMarket(state, cid, now);
      if (!best) { el.textContent = ''; return; }
      if (best.regionId === view.market) {
        el.textContent = '⭐ Ini pasar dengan harga bersih terbaik sekarang';
      } else {
        el.textContent = '💡 Lebih untung di ' + D.regions[best.regionId].name + ': ' + F.price(best.price) + ' bersih per unit';
      }
    });
    if (view.tab === 'market') {
      each('[data-live="spark"]', function (el) { el.innerHTML = sparkSvg(state, el.getAttribute('data-c'), now); });
    }
    each('[data-live="signal"]', function (el) {
      const sg = E.priceSignal(state, view.market, el.getAttribute('data-c'), now);
      el.innerHTML = sg.id === 'bagus' ? '<span class="sig good">🔥 Harga bagus</span>'
        : (sg.id === 'rendah' ? '<span class="sig low">🕳️ Harga rendah</span>' : '');
    });
    each('[data-live="hint"]', function (el) {
      const sg = E.priceSignal(state, view.market, el.getAttribute('data-c'), now);
      el.textContent = sg.peakInMin !== null ? '📈 Puncak sekitar ' + sg.peakInMin + ' menit lagi (' + F.price(sg.peakPrice) + ')'
        : (sg.id === 'bagus' ? '✅ Sekarang dekat puncak, waktu bagus untuk menjual' : '');
    });
    each('[data-live="quote"]', function (el) {
      const cid = el.getAttribute('data-c');
      const have = Math.floor(state.inventory[cid] || 0);
      if (have < 1) { el.textContent = ''; return; }
      const q = E.quoteSale(state, cid, view.market, have, now);
      el.textContent = 'Jual semua ' + F.num(have) + ' ≈ ' + F.money(Math.max(0, q.net)) + ' bersih';
    });
    each('[data-live="sellall-est"]', function (el) {
      const q = E.quoteSellAll(state, view.market, now);
      el.textContent = q.qty > 0 ? '· ≈ ' + F.money(q.net) : '';
      el.parentNode.disabled = q.qty < 1;
    });
    each('[data-action="sell"]', function (el) {
      const have = state.inventory[el.getAttribute('data-c')] || 0;
      const qty = el.getAttribute('data-qty');
      el.disabled = qty === 'all' ? have < 1 : have < Number(qty);
    });

    // Capaian dan upgrade termurah
    each('[data-live="playtime"]', function (el) { el.textContent = F.duration((state.stats && state.stats.playMs) || 0); });
    const cu = E.cheapestUpgrade(state);
    const cbtn = document.querySelector('.cheapest');
    if (cbtn) {
      cbtn.setAttribute('data-cost', cu ? cu.cost : 0);
      cbtn.setAttribute('data-none', cu ? '0' : '1');
      const lab = cbtn.querySelector('[data-live="cheapest-label"]');
      const txt = cu ? '⬆ Upgrade termurah: ' + cu.label + ' · ' + F.money(cu.cost) : 'Semua upgrade sudah maksimal';
      if (lab && lab.textContent !== txt) lab.textContent = txt;
      if (!cu) cbtn.disabled = true;
    }

    // Info
    each('[data-live="rank-big"]', function (el) { el.textContent = rk.current.name + ' · skor ' + F.num(sc); });
    each('[data-live="rank-bar"]', function (el) {
      const pct = rk.next ? (sc - rk.current.min) / (rk.next.min - rk.current.min) * 100 : 100;
      el.style.width = Math.max(0, Math.min(100, pct)) + '%';
    });
    each('[data-live="rank-next"]', function (el) {
      el.textContent = rk.next ? 'Berikutnya: ' + rk.next.name + ' (skor ' + F.num(rk.next.min) + ')' : 'Gelar tertinggi tercapai';
    });
  }

  NT.ui.panels = { view: view, renderAll: renderAll, tick: tick, glossary: GLOSSARY };
})((window.NT = window.NT || {}));

</script>
  <script>
/* Layar "Selamat datang kembali": ringkasan apa yang terjadi selama pemain pergi. */
(function (NT) {
  NT.ui = NT.ui || {};
  const D = NT.data;
  const E = NT.economy;
  const F = NT.fmt;
  let open = null;   // { el, prevFocus, onKey }

  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function jobName(j) {
    const what = j.kind === 'building' ? D.buildings[j.id].name : D.infra[j.id].name + ' ' + D.regions[j.region].name;
    return what + (j.kind === 'building' && j.from === 0 ? ' selesai dibangun' : ' naik ke Lv ' + j.to);
  }

  // Hasil yang menunggu, dijumlahkan per komoditas. "full" = ada gudang yang sudah penuh (produksi berhenti).
  function waiting(state, now) {
    const byCom = {};
    Object.keys(state.buildings).forEach(function (id) {
      const cid = D.buildings[id].produces;
      const p = E.pending(state, id, now);
      const row = byCom[cid] || (byCom[cid] = { qty: 0, full: false });
      row.qty += p;
      if (p >= E.capacity(state, id, now) - 0.001) row.full = true;
    });
    return Object.keys(byCom).map(function (cid) {
      return { cid: cid, qty: Math.floor(byCom[cid].qty), full: byCom[cid].full };
    }).filter(function (r) { return r.qty >= 1; });
  }

  function close() {
    if (!open) return;
    document.removeEventListener('keydown', open.onKey);
    if (open.el.parentNode) open.el.parentNode.removeChild(open.el);
    if (open.prevFocus && open.prevFocus.focus) open.prevFocus.focus();
    open = null;
  }

  // Mengembalikan true bila layar ditampilkan (ada sesuatu yang layak dilaporkan).
  function show(state, awayMs, finished, now) {
    if (open) return false;
    const items = waiting(state, now);
    if (!items.length && !(finished && finished.length)) return false;

    const anyFull = items.some(function (r) { return r.full; });
    let body = '';
    if (items.length) {
      body += '<h3>Siap dikumpulkan</h3><ul class="wb-list">' + items.map(function (r) {
        const c = D.commodities[r.cid];
        return '<li><span class="wb-ico">' + (NT.ui.art.comm(r.cid, 'sm') || c.icon) + '</span><span class="wb-name">' + esc(c.name) + '</span>' +
          '<b>+' + F.num(r.qty) + '</b>' + (r.full ? '<span class="tag paceklik">gudang penuh</span>' : '') + '</li>';
      }).join('') + '</ul>';
      if (anyFull) {
        body += '<p class="muted small">Gudang yang penuh berhenti berproduksi. Gudang terisi penuh setelah ' +
          NT.config.storageHours + ' jam, jadi kumpulkan lebih sering atau naikkan level bangunan.</p>';
      }
    }
    if (finished && finished.length) {
      body += '<h3>Selesai saat kamu pergi</h3><ul class="wb-list">' + finished.map(function (j) {
        return '<li><span class="wb-ico">✅</span><span class="wb-name">' + esc(jobName(j)) + '</span></li>';
      }).join('') + '</ul>';
    }

    const actions = items.length
      ? '<button class="btn primary wide" data-action="collect-all" data-close>📦 Kumpulkan semua hasil</button>' +
        '<button class="btn wide" data-close>Nanti saja</button>'
      : '<button class="btn primary wide" data-close>Lanjut bermain</button>';

    const el = document.createElement('div');
    el.className = 'modal-backdrop';
    el.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="wb-title">' +
      '<h2 id="wb-title">Selamat datang kembali!</h2>' +
      '<p class="muted">Kamu pergi selama <b>' + F.duration(awayMs) + '</b>.</p>' + body +
      '<div class="modal-actions">' + actions + '</div></div>';
    document.body.appendChild(el);

    const onKey = function (e) { if (e.key === 'Escape') close(); };
    open = { el: el, prevFocus: document.activeElement, onKey: onKey };
    document.addEventListener('keydown', onKey);
    el.addEventListener('click', function (e) {
      // Klik di luar kotak menutup; tombol bertanda data-close menutup setelah aksinya jalan.
      if (e.target === el) close();
      else if (e.target.closest('[data-close]')) setTimeout(close, 0);
    });
    const first = el.querySelector('.btn');
    if (first) first.focus();
    return true;
  }

  NT.ui.welcome = { show: show, close: close };
})((window.NT = window.NT || {}));

</script>
  <script>
/* Titik masuk: memuat data, menyambungkan aksi pemain, menjalankan loop. */
(function (NT) {
  const E = NT.economy;
  const F = NT.fmt;
  const P = NT.ui.panels;
  const toast = NT.ui.toast;

  let state = null;
  let storage = null;
  let saveTimer = null;
  let saveErrorShown = false;
  // Jika memuat gagal, jangan menyimpan agar progres cloud tidak tertimpa.
  let loadFailed = false;

  const AWAY_MS = 2 * 60000;   // pergi lebih lama dari ini = tampilkan layar sambutan
  const SEEN_KEY = 'nt-lastseen';
  const COST_ACTIONS = { 'upgrade-building': 1, 'upgrade-infra': 1, unlock: 1, speedup: 1, cheapest: 1 };
  // Aksi yang dicatat di log aktivitas (ikon di depan pesan toast-nya).
  const LOG_ICONS = { sell: '💰', 'sell-everything': '💰', 'upgrade-building': '🔨', 'upgrade-infra': '🛣️', cheapest: '🔨', unlock: '🔓', speedup: '⚡' };

  function now() { return Date.now(); }

  function readSeen() { try { return Number(localStorage.getItem(SEEN_KEY)) || 0; } catch (e) { return 0; } }
  function touchSeen() { try { localStorage.setItem(SEEN_KEY, String(now())); } catch (e) { /* abaikan */ } }

  /* ---------- Simpan ---------- */

  function persist() {
    touchSeen();
    if (loadFailed) return Promise.resolve();
    return storage.save(state).then(function (ok) {
      if (ok === false && !saveErrorShown) {
        saveErrorShown = true;
        toast('Gagal menyimpan. Kemajuan mungkin hilang bila halaman ditutup.', 'warn');
      }
    }).catch(function (e) {
      if (!saveErrorShown) {
        saveErrorShown = true;
        toast('Gagal menyimpan: ' + e.message, 'warn');
      }
    });
  }

  function persistSoon() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 400);
  }

  /* ---------- Aksi pemain ---------- */

  function describeItems(items) {
    return Object.keys(items).map(function (cid) {
      return F.num(items[cid]) + ' ' + NT.data.commodities[cid].name;
    }).join(', ');
  }

  /* ---------- Log dan pencapaian ---------- */

  function logEvent(icon, text) {
    if (!state.log) state.log = [];
    state.log.push({ t: now(), i: icon, x: text });
    while (state.log.length > NT.state.LOG_MAX) state.log.shift();
  }

  // Cek pencapaian dan panduan; true bila ada yang baru (perlu simpan dan gambar ulang).
  function checkProgress(quiet) {
    const fresh = NT.achievements.evaluate(state, now());
    let changed = fresh.length > 0;
    if (quiet && fresh.length > 1) {
      toast('🏆 ' + fresh.length + ' pencapaian terbuka dari kemajuanmu. Lihat di tab Capaian.', 'info');
    } else {
      fresh.forEach(function (a) { toast('🏆 Pencapaian: ' + a.name + '!', 'ok'); });
    }
    fresh.forEach(function (a) { logEvent('🏆', 'Pencapaian: ' + a.name); });
    if (fresh.length && !quiet) NT.ui.fx.sfx('done');
    if (!state.guideHidden && NT.achievements.guide(state).complete) {
      state.guideHidden = true;
      changed = true;
      if (!quiet) toast('🎓 Panduan awal selesai. Selamat!', 'ok');
    }
    return changed;
  }

  function celebrate(done, offline) {
    done.forEach(function (j) {
      const name = j.kind === 'building' ? NT.data.buildings[j.id].name
        : NT.data.infra[j.id].name + ' ' + NT.data.regions[j.region].name;
      const msg = name + (j.kind === 'building' && j.from === 0 ? ' selesai dibangun!' : ' naik ke Lv ' + j.to + '!');
      toast('✅ ' + msg, 'ok');
      logEvent('✅', msg);
    });
    NT.ui.fx.sfx('done');
    if (!offline) NT.ui.fx.confetti(window.innerWidth / 2, window.innerHeight * 0.35);
  }

  const actions = {
    setting: function (el) {
      if (NT.ui.settings.set(el.getAttribute('data-key'), el.getAttribute('data-value'))) NT.ui.fx.sfx('click');
      return { silent: true };
    },

    export: function () {
      const data = JSON.stringify({ game: 'nusantara-tycoon', exportedAt: new Date().toISOString(), state: state }, null, 2);
      const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = 'nusantara-tycoon-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      return { ok: true, message: 'Cadangan disimpan ke file.', sfx: 'coin' };
    },

    'reset-ask': function () { P.view.resetArmed = true; return { silent: true }; },
    'reset-cancel': function () { P.view.resetArmed = false; return { silent: true }; },

    speedup: function (el) {
      const res = E.speedup(state, el.getAttribute('data-key'), now());
      if (res.ok) { res.message = '⚡ Selesai seketika!'; res.sfx = 'done'; }
      return res;
    },

    tab: function (el) {
      P.view.tab = el.getAttribute('data-id');
      P.view.resetArmed = false;
      return { silent: true };
    },

    'collect-all': function () {
      const res = E.collectAll(state, now());
      if (res.ok) { res.message = 'Terkumpul: ' + describeItems(res.items); res.fx = '+' + F.num(res.total) + ' 📦'; res.sfx = 'coin'; }
      return res;
    },

    collect: function (el) {
      const res = E.collect(state, el.getAttribute('data-id'), now());
      if (res.ok) { res.message = '+' + F.num(res.amount) + ' ' + NT.data.commodities[res.commodity].name; res.fx = '+' + F.num(res.amount) + ' ' + NT.data.commodities[res.commodity].icon; res.sfx = 'coin'; }
      return res;
    },

    'upgrade-building': function (el) {
      const res = E.upgradeBuilding(state, el.getAttribute('data-id'), now());
      if (res.ok) {
        res.message = res.queued ? '🔨 ' + (res.built ? 'Mulai dibangun' : 'Upgrade dimulai') + ' · selesai dalam ' + F.short(res.durationMs)
          : (res.built ? 'Dibangun!' : 'Naik ke level ' + res.level + '!');
        res.sfx = 'start';
      }
      return res;
    },

    'upgrade-infra': function (el) {
      const res = E.upgradeInfra(state, el.getAttribute('data-region'), el.getAttribute('data-id'), now());
      if (res.ok) {
        res.message = res.queued ? '🔨 Pembangunan dimulai · selesai dalam ' + F.short(res.durationMs) : 'Infrastruktur naik ke level ' + res.level + '!';
        res.sfx = 'start';
      }
      return res;
    },

    unlock: function (el) {
      const id = el.getAttribute('data-id');
      const res = E.unlockRegion(state, id);
      if (res.ok) res.message = NT.data.regions[id].name + ' terbuka! Pasar baru tersedia.';
      return res;
    },

    sell: function (el) {
      const cid = el.getAttribute('data-c');
      const q = el.getAttribute('data-qty');
      const qty = q === 'all' ? (state.inventory[cid] || 0) : Number(q);
      const market = P.view.market;
      const res = E.sell(state, cid, market, qty, now());
      if (res.ok) {
        if (res.queued) {
          res.message = '🚚 ' + F.num(res.qty) + ' ' + NT.data.commodities[cid].name + ' dikirim ke ' + NT.data.regions[market].name +
            ' · tiba dalam ' + F.short(res.durationMs) + ' (+' + F.money(res.net) + ')';
          res.sfx = 'click';
        } else {
          res.message = 'Terjual ' + F.num(res.qty) + ' ' + NT.data.commodities[cid].name +
            ' di ' + NT.data.regions[market].name + ': +' + F.money(res.net);
          res.fx = '+' + F.money(res.net); res.fxClass = 'gold'; res.sfx = 'coin';
        }
      }
      return res;
    },

    'ship-export': function (el) {
      const cid = el.getAttribute('data-c'), mid = el.getAttribute('data-x');
      const have = Math.floor(state.inventory[cid] || 0);
      const qty = Math.min(have, Math.max(1, E.exportMaxQty(state, cid)));
      const res = E.exportGoods(state, cid, mid, qty, now());
      if (res.ok) {
        res.message = '🚢 ' + F.num(res.qty) + ' ' + NT.data.commodities[cid].name + ' berlayar ke ' + NT.data.exportMarkets[mid].name +
          ' · tiba dalam ' + F.short(res.durationMs) + ' (+' + F.money(res.net) + ')' +
          (res.dmoQty ? ' · ' + F.num(res.dmoQty) + ' wajib dalam negeri (+' + F.money(res.dmoNet) + ')' : '');
        res.sfx = 'click';
      }
      return res;
    },

    'pick-region': function (el) {
      selectRegion(el.getAttribute('data-id'));
      return { silent: true, skipRender: true };
    },

    'sell-everything': function () {
      const market = P.view.market;
      const res = E.sellAll(state, market, now());
      if (res.ok) {
        const tail = res.skipped.length ? ' (' + res.skipped.length + ' jenis dilewati: rugi atau kapal penuh)' : '';
        if (res.queued) {
          res.message = '🚚 ' + F.num(res.qty) + ' barang dikirim ke ' + NT.data.regions[market].name + ' · tiba dalam ' + F.short(res.durationMs) +
            ' (+' + F.money(res.net) + ')' + tail;
          res.sfx = 'click';
        } else {
          res.message = 'Terjual ' + F.num(res.qty) + ' barang di ' + NT.data.regions[market].name + ': +' + F.money(res.net) + tail;
          res.fx = '+' + F.money(res.net); res.fxClass = 'gold'; res.sfx = 'coin';
        }
      }
      return res;
    },

    cheapest: function () {
      const c = E.cheapestUpgrade(state);
      if (!c) return { ok: false, reason: 'Semua upgrade sudah level maksimum.' };
      const res = c.kind === 'building' ? E.upgradeBuilding(state, c.id, now()) : E.upgradeInfra(state, c.region, c.id, now());
      if (res.ok) {
        res.message = '🔨 ' + c.label + (res.queued ? ' · selesai dalam ' + F.short(res.durationMs) : ' selesai!');
        res.sfx = 'start';
      }
      return res;
    },

    term: function (el) {
      const text = P.glossary[el.getAttribute('data-term')];
      if (text) toast(text, 'info');
      return { silent: true, skipRender: true };
    },

    'guide-toggle': function () { P.view.guideOpen = !P.view.guideOpen; return { silent: true }; },
    'guide-hide': function () { state.guideHidden = true; P.view.guideOpen = false; persistSoon(); return { silent: true }; },
    'guide-show': function () {
      state.guideHidden = false;
      P.view.guideOpen = true;
      P.view.tab = 'map';
      persistSoon();
      return { silent: true };
    },

    'sheet-close': function () { P.view.sheet = false; return { silent: true }; },

    'market-region': function (el) {
      P.view.market = el.getAttribute('data-id');
      return { silent: true };
    },

    reset: function () {
      if (!P.view.resetArmed) return { silent: true };
      P.view.resetArmed = false;
      try { localStorage.removeItem(SEEN_KEY); } catch (e) { /* abaikan */ }
      state = NT.state.createInitialState(now());
      P.view.region = 'jawa';
      P.view.market = 'jawa';
      P.view.tab = 'map';
      P.view.guideOpen = false;
      loadFailed = false;
      storage.reset().then(persist);
      return { ok: true, message: 'Game dimulai ulang.' };
    }
  };

  function handle(name, el) {
    const fn = actions[name];
    if (!fn) return;
    const rect = el.getBoundingClientRect ? el.getBoundingClientRect() : null;
    const early = E.settle(state, now()); // pastikan pembangunan yang waktunya habis sudah diterapkan
    if (early.length) celebrate(early);
    if (COST_ACTIONS[name]) {
      const frac = NT.ui.settings.confirmFraction();
      const cost = Number(el.getAttribute('data-cost')) || 0;
      if (frac && cost > 0 && cost >= state.cash * frac &&
          !window.confirm('Keluarkan ' + F.money(cost) + ' (' + Math.round(cost / state.cash * 100) + '% dari kasmu)?')) return;
    }
    const res = fn(el);
    if (!res.silent) {
      if (res.ok) {
        if (res.message) toast(res.message, 'ok');
        if (LOG_ICONS[name] && res.message) logEvent(LOG_ICONS[name], res.message.replace(/^🔨\s*/, ''));
        if (res.fx) NT.ui.fx.floatFromRect(rect, res.fx, res.fxClass);
        if (res.sfx === 'done') NT.ui.fx.confetti(window.innerWidth / 2, window.innerHeight * 0.35);
        NT.ui.fx.sfx(res.sfx || 'click');
        persistSoon();
      } else {
        toast(res.reason, 'warn');
        NT.ui.fx.sfx('error');
      }
    }
    if (!res.silent && res.ok && checkProgress(false)) persistSoon();
    if (!res.skipRender) P.renderAll(state, now());
  }

  /* ---------- Impor cadangan ---------- */

  function importFile(file, input) {
    const reader = new FileReader();
    reader.onload = function () {
      input.value = '';
      let obj = null;
      try { obj = JSON.parse(reader.result); } catch (e) { /* ditangani di bawah */ }
      const saved = obj && obj.state ? obj.state : obj;
      if (!saved || typeof saved !== 'object' || !Number.isFinite(Number(saved.cash)) || !saved.buildings || typeof saved.buildings !== 'object') {
        toast('File ini bukan cadangan Nusantara Tycoon yang valid.', 'warn');
        return;
      }
      if (!window.confirm('Timpa kemajuan sekarang dengan isi file ini?')) return;
      state = NT.state.normalize(saved, now());
      loadFailed = false;
      persist();
      P.renderAll(state, now());
      toast('Cadangan dipulihkan.', 'ok');
    };
    reader.onerror = function () { toast('File tidak bisa dibaca.', 'warn'); };
    reader.readAsText(file);
  }

  // Di HP panel wilayah berupa lembar dari bawah; di desktop kelas "open" tidak berpengaruh.
  function selectRegion(id) {
    const wasOpen = P.view.sheet;
    P.view.region = id;
    P.view.sheet = true;
    P.renderAll(state, now());
    NT.ui.map.focus(id);
    if (!wasOpen && window.matchMedia('(max-width: 979px)').matches) {
      const card = document.querySelector('.map-card');
      if (card) card.scrollIntoView({ block: 'start', behavior: document.body.classList.contains('calm') ? 'auto' : 'smooth' });
    }
  }

  // Geser lembar ke bawah untuk menutup.
  function bindSheet() {
    const grab = document.getElementById('sheet-grab');
    const box = document.getElementById('sheet-box');
    if (!grab || !box) return;
    let y0 = null, dy = 0;
    grab.addEventListener('touchstart', function (e) { y0 = e.touches[0].clientY; dy = 0; box.style.transition = 'none'; }, { passive: true });
    grab.addEventListener('touchmove', function (e) {
      if (y0 === null) return;
      dy = Math.max(0, e.touches[0].clientY - y0);
      box.style.transform = 'translateY(' + dy + 'px)';
    }, { passive: true });
    function end() {
      if (y0 === null) return;
      const close = dy > 70;
      y0 = null;
      box.style.transition = '';
      box.style.transform = '';
      if (close) { P.view.sheet = false; P.renderAll(state, now()); }
    }
    grab.addEventListener('touchend', end);
    grab.addEventListener('touchcancel', end);
    grab.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); P.view.sheet = false; P.renderAll(state, now()); }
    });
  }

  function bindEvents() {
    document.addEventListener('click', function (e) {
      const bubble = e.target.closest('.bubble.on');
      if (bubble) { handle('collect', bubble); return; }

      const island = e.target.closest('.island');
      if (island) { selectRegion(island.getAttribute('data-region')); return; }

      const el = e.target.closest('[data-action]');
      if (!el || el.disabled) return;
      handle(el.getAttribute('data-action'), el);
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && P.view.sheet) { P.view.sheet = false; P.renderAll(state, now()); return; }
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const island = e.target.closest && e.target.closest('.island');
      if (island) { e.preventDefault(); selectRegion(island.getAttribute('data-region')); return; }
      const ts = e.target.closest && e.target.closest('.term-stat');
      if (ts) { e.preventDefault(); handle('term', ts); }
    });

    document.addEventListener('change', function (e) {
      if (e.target && e.target.id === 'import-file' && e.target.files && e.target.files[0]) importFile(e.target.files[0], e.target);
    });

    // Kembali ke tab setelah lama: tampilkan ringkasan seperti saat membuka game.
    let hiddenAt = 0;
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { hiddenAt = now(); persist(); return; }
      if (!hiddenAt || !state) return;
      const t = now(), away = t - hiddenAt;
      hiddenAt = 0;
      if (away < AWAY_MS) return;
      const done = E.settle(state, t);
      E.settleShipments(state, t);
      if (!NT.ui.welcome.show(state, away, done, t) && done.length) celebrate(done, true);
      P.renderAll(state, t);
    });
    window.addEventListener('pagehide', persist);
  }

  /* ---------- Mulai ---------- */

  async function start() {
    const lastSeen = readSeen();   // dibaca sebelum apa pun menimpanya
    storage = NT.getStorage();

    let saved = null;
    try {
      saved = await storage.load();
    } catch (e) {
      loadFailed = true;
      toast('Gagal memuat data tersimpan: ' + e.message + '. Progres tidak akan disimpan sampai halaman dimuat ulang.', 'warn');
    }

    const t = now();
    state = NT.state.normalize(saved, t);
    const finishedAway = E.settle(state, t); // pembangunan yang selesai saat pemain pergi
    E.settleShipments(state, t);              // kiriman yang tiba saat pemain pergi

    NT.ui.settings.apply();
    NT.ui.map.mount();
    bindEvents();
    bindSheet();
    P.renderAll(state, t);

    // Layar sambutan bila pemain pergi cukup lama; bila tidak, cukup toast untuk pembangunan yang selesai.
    const away = lastSeen ? t - lastSeen : 0;
    const welcomed = saved && away > AWAY_MS && NT.ui.welcome.show(state, away, finishedAway, t);
    if (!welcomed && finishedAway.length) celebrate(finishedAway, true);
    if (checkProgress(true)) { persistSoon(); P.renderAll(state, t); }
    touchSeen();

    setInterval(function () {
      const t2 = now();
      if (!document.hidden) state.stats.playMs += 1000;
      const done = E.settle(state, t2);
      const arrived = E.settleShipments(state, t2);
      if (arrived.length) {
        const sum = arrived.reduce(function (a, x) { return a + x.net; }, 0);
        toast((arrived[0].kind === 'export' ? '🚢 ' : '🚚 ') + arrived.length + ' kiriman tiba: +' + F.money(sum), 'ok');
        if (NT.ui.fx && NT.ui.fx.sfx) NT.ui.fx.sfx('coin');
        persistSoon();
      }
      const gained = checkProgress(false);
      if (done.length || gained || arrived.length) { if (done.length) celebrate(done); P.renderAll(state, t2); persistSoon(); } else { P.tick(state, t2); }
    }, 1000);
    setInterval(persist, NT.config.autosaveMs);
  }

  start();
})((window.NT = window.NT || {}));
