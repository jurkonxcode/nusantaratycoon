  <script>
/*
 * Driver Supabase (tahap 1: simpan seluruh state sebagai satu baris JSON per pemain).
 * BELUM DIUJI. Langkah mengaktifkan ada di README.md.
 *
 * Catatan keamanan: di tahap ini klien masih bisa mengubah state-nya sendiri.
 * Untuk multiplayer sungguhan, pindahkan aturan di js/core/economy.js
 * (sell, collect, upgrade, unlock) ke Postgres function lalu panggil lewat supabase.rpc().
 */
(function (NT) {
  NT.storageDrivers = NT.storageDrivers || {};

  let client = null;

  function getClient() {
    if (client) return client;
    if (!window.supabase || !window.supabase.createClient) {
      throw new Error('supabase-js belum dimuat. Aktifkan tag script CDN di index.html.');
    }
    const cfg = NT.config.supabase;
    if (!cfg.url || !cfg.anonKey) {
      throw new Error('Isi supabase.url dan supabase.anonKey di js/config.js.');
    }
    client = window.supabase.createClient(cfg.url, cfg.anonKey);
    return client;
  }

  // Masuk anonim dulu (aktifkan "Anonymous sign-ins" di dashboard Supabase).
  // Nanti bisa diganti login email / Google.
  async function userId() {
    const c = getClient();
    const current = await c.auth.getSession();
    let session = current.data.session;
    if (!session) {
      const res = await c.auth.signInAnonymously();
      if (res.error) throw res.error;
      session = res.data.session;
    }
    return session.user.id;
  }

  NT.storageDrivers.supabase = {
    label: 'Tersimpan di cloud (Supabase)',

    async load() {
      const c = getClient();
      const uid = await userId();
      const res = await c.from('game_saves').select('state').eq('user_id', uid).maybeSingle();
      if (res.error) throw res.error;
      return res.data ? res.data.state : null;
    },

    async save(state) {
      const c = getClient();
      const uid = await userId();
      const res = await c.from('game_saves').upsert({
        user_id: uid,
        state: state,
        updated_at: new Date().toISOString()
      });
      if (res.error) throw res.error;
      return true;
    },

    async reset() {
      const c = getClient();
      const uid = await userId();
      const res = await c.from('game_saves').delete().eq('user_id', uid);
      if (res.error) throw res.error;
    }
  };
})((window.NT = window.NT || {}));

/* Efek rasa-main: angka melayang, confetti, suara sintetis, hitung kas bergulir. Tidak ada file aset. */
(function (NT) {
  NT.ui = NT.ui || {};

  let ctx = null;
  let muted = false;
  let volume = 1;
  try { muted = localStorage.getItem('nt-muted') === '1'; } catch (e) { /* abaikan */ }

  function audio() {
    if (muted) return null;
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();

  function tone(freq, start, dur, type, vol) {
    const a = audio();
    if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    const t = a.currentTime + start;
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime((vol || 0.05) * volume, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }

  const SFX = {
    coin: function () { tone(988, 0, 0.08); tone(1319, 0.07, 0.16); },
    click: function () { tone(440, 0, 0.05, 'triangle', 0.06); },
    start: function () { tone(330, 0, 0.08, 'triangle', 0.07); tone(392, 0.08, 0.12, 'triangle', 0.07); },
    done: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.09, 0.2); }); },
    error: function () { tone(180, 0, 0.16, 'sawtooth', 0.04); }
  };

  function sfx(name) { try { if (SFX[name]) SFX[name](); } catch (e) { /* suara tidak boleh merusak game */ } }

  function toggleMute() {
    muted = !muted;
    try { localStorage.setItem('nt-muted', muted ? '1' : '0'); } catch (e) { /* abaikan */ }
    if (!muted) sfx('click');
    return muted;
  }

  function calm() { return document.body.classList.contains('calm'); }

  function setMuted(m) {
    muted = !!m;
    try { localStorage.setItem('nt-muted', muted ? '1' : '0'); } catch (e) { /* abaikan */ }
  }

  function floatText(x, y, text, cls) {
    if (calm()) return;
    const el = document.createElement('div');
    el.className = 'floaty ' + (cls || '');
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1300);
  }

  function floatFromRect(rect, text, cls) {
    if (rect) floatText(rect.left + rect.width / 2, rect.top, text, cls);

  function confetti(x, y) {

    const colors = ['#f0c25f', '#d9a441', '#6fbf5a', '#2d8fd0', '#e98aa8', '#c8472f'];
    for (let i = 0; i < 28; i++) {
      const p = document.createElement('i');
      const ang = Math.random() * Math.PI * 2, d = 60 + Math.random() * 120;
      p.className = 'confetti';
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      p.style.background = colors[i % colors.length];
      p.style.setProperty('--dx', Math.cos(ang) * d + 'px');
      p.style.setProperty('--dy', (Math.sin(ang) * d - 50) + 'px');

/*
 * Pengaturan pemain (suara, tampilan, permainan). Disimpan di browser ini saja (localStorage),
 * terpisah dari data game, jadi tidak ikut tersimpan di cloud dan tidak mengubah struktur save.
 */
(function (NT) {
  NT.ui = NT.ui || {};
  const KEY = 'nt-settings';

  // Pilihan untuk tiap pengaturan: [nilai, label]. Urutan = urutan tombol di panel.
  const OPTIONS = {
    volume: [['pelan', 'Pelan'], ['sedang', 'Sedang'], ['keras', 'Keras']],
    textSize: [['normal', 'Normal'], ['large', 'Besar'], ['xlarge', 'Sangat besar']],
    confirm: [['off', 'Mati'], ['half', 'Biaya ≥ 50% kas'], ['most', 'Biaya ≥ 80% kas']]
  };
  const VOLUME = { pelan: 0.4, sedang: 1, keras: 1.8 };
  const CONFIRM_FRAC = { off: 0, half: 0.5, most: 0.8 };

  const DEFAULTS = { sfx: true, volume: 'sedang', textSize: 'normal', calm: false, confirm: 'off', compact: true };
  let cfg = Object.assign({}, DEFAULTS);

  function valid(key, val) {
    if (typeof DEFAULTS[key] === 'boolean') return typeof val === 'boolean';
    return !!OPTIONS[key] && OPTIONS[key].some(function (o) { return o[0] === val; });
  }

  function load() {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(KEY)); } catch (e) { /* abaikan */ }
    if (raw && typeof raw === 'object') {
      Object.keys(DEFAULTS).forEach(function (k) { if (valid(k, raw[k])) cfg[k] = raw[k]; });
    } else {
      // Pemain lama: hormati pilihan bisu dari versi sebelumnya.
      try { if (localStorage.getItem('nt-muted') === '1') cfg.sfx = false; } catch (e) { /* abaikan */ }
    }
  }

  function save() { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) { /* abaikan */ } }

  function apply() {
    NT.ui.fx.setMuted(!cfg.sfx);
    NT.ui.fx.setVolume(VOLUME[cfg.volume] || 1);
    NT.fmt.setCompact(cfg.compact);
    const cl = document.body.classList;
    cl.toggle('calm', cfg.calm);
    cl.toggle('text-large', cfg.textSize === 'large');
    cl.toggle('text-xlarge', cfg.textSize === 'xlarge');
  }

  function set(key, raw) {
    const val = raw === 'true' ? true : (raw === 'false' ? false : raw);
    if (!(key in DEFAULTS) || !valid(key, val)) return false;
    cfg[key] = val;
    save();
    apply();
    return true;
  }

  load();
  NT.ui.settings = {
    options: OPTIONS,
    get: function (key) { return cfg[key]; },
    set: set,
    apply: apply,
    // Bagian dari kas yang memicu konfirmasi pembelian (0 = tidak pernah).
    confirmFraction: function () { return CONFIRM_FRAC[cfg.confirm] || 0; }
  };
})((window.NT = window.NT || {}));

      if (e2 >= dy) { err += dy; x += sx; }
      if (e2 <= dx) { err += dx; y += sy; }
    }
    return d;
  }

  // Lencana pembangunan: palu bergoyang dan bar progres (lebar diisi tiap detik oleh tickJobs).
  function jobBadge(x, y, key) {
    return '<g class="jobbadge" transform="translate(' + x + ',' + y + ')"><g class="ui-b"><text class="hammer" text-anchor="middle" dy="-4">🔨</text>' +
      '<rect class="jb-bg" x="-14" y="2" width="28" height="5" rx="2"/>' +
      '<rect class="jb-fill" data-job="' + key + '" x="-14" y="2" width="0" height="5" rx="2"/></g></g>';
  }

  function dynMarkup(r, rs, state) {
    if (r.comingSoon || !rs.unlocked) return '';
    const m = r.map;
    const tol = (rs.infra && rs.infra.tol) || 0;
    const port = (rs.infra && rs.infra.pelabuhan) || 0;
    let out = '';

    if (tol > 0) {
      const c0 = NT.raster.toCell(m.pin[0], m.pin[1]);
      const ends = Object.keys(m.slots || {}).map(function (bid) { return NT.raster.toCell(m.slots[bid][0], m.slots[bid][1]); });
      if (m.port) ends.push(NT.raster.toCell(m.port[0], m.port[1]));
      const width = tol >= 3 ? 2 : 1;
      out += '<path class="road" d="' + ends.map(function (e) { return linePath(c0, e, width); }).join('') + '"/>';
    }

    // Semua objek diurutkan menurut posisi y (yang di utara digambar dulu), lencana dan gelembung selalu di atas.
    const items = [], top = [];
    // Sprite berdiri dengan titik tanahnya (sekitar 84% tinggi gambar) tepat di koordinat slot.
    // Sedikit perspektif: makin ke selatan sedikit lebih besar.
    const gy = NT.raster.grid().H * S;
    // Varian tingkat sprite ('<id>_t2', '<id>_t3') bila ada; kalau tidak, sprite dasar.
    function tierName(id, tier) { return tier >= 2 ? [id, tier] : id; }
    function put(name, p, size, opacity) {
      const k = 0.92 + 0.16 * Math.min(1, Math.max(0, p.y / gy));
      const sz = Math.round(size * k);
      const cy = p.y + 4 - sz * 0.22;
      // name bisa 'id' atau [id, tingkat]: tingkat 2/3 digambar sebagai lapisan hiasan kecil di atas sprite dasar.
      const id = Array.isArray(name) ? name[0] : name, tier = Array.isArray(name) ? name[1] : 1;
      let svg = NT.ui.art.map(id, p.x, cy, sz, opacity);
      if (tier >= 2 && NT.assets && NT.assets.sprite[id + '_t' + tier]) svg += NT.ui.art.map(id + '_t' + tier, p.x, cy, sz, opacity);
      items.push({ y: p.y, svg: svg });
    }

    Object.keys(m.slots || {}).forEach(function (bid) {
      const lvl = (state.buildings[bid] && state.buildings[bid].level) || 0;
      const p = pt(m.slots[bid]);
      const job = NT.economy.jobFor(state, 'b:' + bid);
      put(tierName(bid, lvl >= 6 ? 3 : (lvl >= 3 ? 2 : 1)), p, lvl >= 3 ? 46 : 40, lvl ? (job ? 0.7 : null) : (job ? 0.55 : 0.28));
      if (lvl) {
        top.push('<g class=\"bubble\" data-id=\"' + bid + '\" transform=\"translate(' + p.x + ',' + (p.y - 38) + ')\"><g class=\"ui-b\"><g class=\"bob\">' +
          '<circle r=\"11\" class=\"bubble-bg\"/><text class=\"bubble-ico\" text-anchor=\"middle\" dy=\"5\">📦</text></g></g></g>');
      }
      if (job) top.push(jobBadge(p.x, p.y + 12, job.key));
    });
    const tolJob = NT.economy.jobFor(state, 'i:' + r.id + ':tol');
    if (tolJob) { const pp = pt(m.pin); top.push(jobBadge(pp.x, pp.y + 32, tolJob.key)); }

    if (m.port) {
      const p = pt(m.port);
      put(tierName('pelabuhan', port >= 5 ? 3 : (port >= 3 ? 2 : 1)), p, port >= 3 ? 50 : 44, port ? null : 0.28);
      if (port > 0) put('kapal', { x: p.x - 28 - port * 2, y: p.y + 12 }, 28);
      const portJob = NT.economy.jobFor(state, 'i:' + r.id + ':pelabuhan');
      if (portJob) top.push(jobBadge(p.x, p.y + 16, portJob.key));
    }
    items.sort(function (a, b) { return a.y - b.y; });
    out += items.map(function (it) { return it.svg; }).join('') + top.join('');
    return out;
  }

  const signatures = {};

  // Perbarui kelas (terkunci / dipilih / segera), ikon pin, dan lapisan dinamis sesuai state.
  function update(state, selectedId) {
    const host = document.getElementById('map');
    if (!host) return;
    Object.keys(D.regions).forEach(function (id) {
      const r = D.regions[id];
      const el = host.querySelector('.island[data-region="' + id + '"]');
      if (!el) return;
      const rs = state.regions[id];
      const unlocked = rs && rs.unlocked;
      el.classList.toggle('soon', !!r.comingSoon);
      el.classList.toggle('locked', !r.comingSoon && !unlocked);
      el.classList.toggle('selected', id === selectedId);
      const pinArt = unlocked && !r.comingSoon && r.artIcon && NT.assets && NT.assets.comm[r.artIcon];
      const pinImg = el.querySelector('.pin-img'), pinTxt = el.querySelector('.pin-icon');
      if (pinArt) { pinImg.setAttribute('href', pinArt); pinImg.setAttribute('visibility', 'visible'); pinTxt.textContent = ''; }
      else { pinImg.setAttribute('visibility', 'hidden'); pinTxt.textContent = r.comingSoon ? '…' : (unlocked ? r.icon : '🔒'); }

      const sig = !rs ? '' : JSON.stringify([unlocked, rs.infra, (r.buildings || []).map(function (b) {
        return state.buildings[b] ? state.buildings[b].level : 0;
      }), (state.jobs || []).filter(function (j) { return j.region === id; }).map(function (j) { return j.key; })]);
      if (signatures[id] !== sig) {
        signatures[id] = sig;
        el.querySelector('.dyn').innerHTML = rs ? dynMarkup(r, rs, state) : '';
      }
    });
  }

  // Tiap detik: isi bar progres pembangunan dan tampilkan gelembung 📦 di bangunan yang hasilnya siap.
  function tickJobs(state, now) {
    document.querySelectorAll('#map [data-job]').forEach(function (el) {
      const j = NT.economy.jobFor(state, el.getAttribute('data-job'));
      if (!j) return;
      const k = Math.max(0, Math.min(1, (now - j.startedAt) / (j.endsAt - j.startedAt)));
      el.setAttribute('width', (28 * k).toFixed(1));
    });
    document.querySelectorAll('#map .bubble').forEach(function (el) {
      const id = el.getAttribute('data-id');
      const cap = NT.economy.capacity(state, id, now) || 1;
      const p = NT.economy.pending(state, id, now);
      el.classList.toggle('on', p >= 1 && p / cap >= 0.2);
    });
  }

  /* ---------- Zoom dan geser ----------
   * Logika hitungan ada di core/viewport.js (murni, dites). Di sini hanya urusan DOM: mengubah viewBox SVG
   * (bukan CSS scale, supaya garis dan sprite tetap tajam), membaca Pointer Events, dan menyimpan posisi.
   * Mengubah viewBox tidak menyentuh isi peta, jadi update() yang mengganti lapisan .dyn tidak mereset zoom. */
  const VP = NT.viewport;
  const view = { stage: null, svg: null, ctx: null, cur: null, raf: 0, anim: 0, saveTimer: 0, btn: {} };

  function mapCfg() { return NT.config.map || {}; }

  function reducedMotion() {
    return document.body.classList.contains('calm') ||
      (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function relPoint(e) {
    const r = view.stage.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  // Tampilan awal: seluruh peta bila kotak cukup lebar; bila "pas layar" membuat peta terlalu kecil (HP),
  // zoom nyaman di sekitar wilayah awal. Patokannya skala, bukan lebar layar: kolom peta desktop bisa hanya ~700 px.
  function defaultView() {
    const c = view.ctx, fit = VP.fitView(c);
    if (VP.fitScale(c) >= (mapCfg().fitMinPx || 0.5)) return fit;
    const start = Object.keys(D.regions).map(function (id) { return D.regions[id]; }).filter(function (r) { return r.start; })[0];
    const p = start ? pt(start.map.pin) : { x: c.world.w / 2, y: c.world.h / 2 };
    return VP.centerOn(fit, p.x, p.y, c, mapCfg().startPx || 0.81);
  }

  function paint() {
    view.raf = 0;
    if (!view.cur) return;
    view.svg.setAttribute('viewBox', VP.viewBoxOf(view.cur, view.ctx));
    updateScaleUi();
    queueRefine();
    const lim = VP.limits(view.ctx);
    if (view.btn.in) { view.btn.in.disabled = view.cur.scale >= lim.max * 0.999; view.btn.out.disabled = view.cur.scale <= lim.min * 1.001; }
  }

  /* ---------- Z2: ukuran elemen UI mengikuti zoom, penggaris km, tekstur tajam ---------- */

  // Kilometer per satuan peta (di khatulistiwa; lintang peta hanya +-10 derajat, selisihnya < 2%).
  function kmPerUnit() { return G.cellDeg / G.cellPx * 111.32; }

  // Label, pin, dan nama laut dikecilkan (dalam satuan peta) saat zoom, supaya ukuran di layar tetap wajar;
  // gelembung dan lencana hanya sedikit, agar tetap enak diketuk. Sprite bangunan sengaja ikut membesar (benda di peta).
  function updateScaleUi() {
    const s = view.cur.scale, c = mapCfg();
    view.svg.style.setProperty('--ui-k', VP.uiScale(s, c.uiFromPx || 1, 1, c.uiMin || 0.3).toFixed(3));
    view.svg.style.setProperty('--ui-kb', VP.uiScale(s, c.uiFromPx || 1, c.uiBubblePower || 0.45, 0.6).toFixed(3));
    if (view.ruler) {
      const bar = VP.scaleBar(s, kmPerUnit(), c.rulerMaxPx || 110);
      view.ruler.bar.style.width = Math.round(bar.px) + 'px';
      view.ruler.txt.textContent = bar.km >= 1 ? (bar.km + ' km') : '';
    }
  }

  // Tekstur tajam: setelah zoom/geser berhenti sebentar, render ulang area yang terlihat dengan k lebih besar.
  function queueRefine() {
    clearTimeout(view.refT);
    view.refT = setTimeout(doRefine, mapCfg().refineDelay || 350);
  }

  function doRefine() {
    view.refT = 0;
    const T = NT.ui.terrain;
    if (!view.cur || !T || !T.refine) return;
    if (view.anim || view.stage.classList.contains('dragging')) { queueRefine(); return; }
    const c = view.ctx, dpr = Math.min(window.devicePixelRatio || 1, mapCfg().maxDpr || 2);
    const need = view.cur.scale * dpr;
    if (need <= T.K) { T.clearRefine(view.svg); return; }     // peta penuh sudah cukup tajam
    const tl = VP.toWorld(view.cur, 0, 0), br = VP.toWorld(view.cur, c.box.w, c.box.h);
    T.refine(view.svg, { x: tl.x, y: tl.y, w: br.x - tl.x, h: br.y - tl.y }, need, mapCfg().texMaxPx);
  }

  // Satu rAF per bingkai: gerakan jari boleh datang berkali-kali, viewBox hanya ditulis sekali.
  function schedule() { if (!view.raf) view.raf = requestAnimationFrame(paint); }

  function saveNow() {
    clearTimeout(view.saveTimer); view.saveTimer = 0;
    if (!view.cur) return;
    try { localStorage.setItem(mapCfg().storeKey || 'nusantara-tycoon-mapview-v1', JSON.stringify(VP.serialize(view.cur, view.ctx))); } catch (e) { /* mode privat: abaikan */ }
  }

  function setView(v, persist) {
    view.cur = v;
    schedule();
    if (persist) { clearTimeout(view.saveTimer); view.saveTimer = setTimeout(saveNow, 400); }
  }

  function cancelAnim() { if (view.anim) { cancelAnimationFrame(view.anim); view.anim = 0; } }

  // Pindah halus ke view target (pusat dan skala diinterpolasi); tanpa animasi bila "Hemat animasi" menyala.
  function animateTo(target) {
    cancelAnim();
    if (!view.cur) return;
    if (reducedMotion()) { setView(target, true); return; }
    const c = view.ctx, from = view.cur;
    const c0 = VP.toWorld(from, c.box.w / 2, c.box.h / 2), c1 = VP.toWorld(target, c.box.w / 2, c.box.h / 2);
    const t0 = performance.now(), dur = 300;
    function step(now) {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      const scale = from.scale * Math.pow(target.scale / from.scale, e);
      setView(VP.centerOn(from, c0.x + (c1.x - c0.x) * e, c0.y + (c1.y - c0.y) * e, c, scale), false);
      if (k < 1) view.anim = requestAnimationFrame(step); else { view.anim = 0; setView(target, true); }
    }
    view.anim = requestAnimationFrame(step);
  }

  function zoomButton(factor) {
    if (!view.cur) return;
    animateTo(VP.zoomAt(view.cur, factor, view.ctx.box.w / 2, view.ctx.box.h / 2, view.ctx));
  }

  function measure() {
    const r = view.stage.getBoundingClientRect();
    return { w: r.width, h: r.height };
  }

  // Ukuran kotak berubah (layar diputar, jendela diubah, tab peta baru terlihat): jaga pusat dan zoom relatif.
  function onResize() {
    const box = measure();
    if (box.w < 1 || box.h < 1) return;        // tab peta sedang tersembunyi
    const old = view.ctx;
    view.ctx = { world: old.world, box: box, maxZoom: old.maxZoom, maxPx: old.maxPx };
    if (!view.cur) {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(mapCfg().storeKey || 'nusantara-tycoon-mapview-v1')); } catch (e) { saved = null; }
      setView(VP.restore(saved, view.ctx) || defaultView(), false);
    } else if (old.box.w >= 1 && old.box.h >= 1) {
      // Pusat dan zoom relatif disimpan lewat serialize terhadap ukuran lama, lalu dipulihkan terhadap yang baru.
      const keep = VP.serialize(view.cur, old);
      setView(VP.restore(keep, view.ctx) || defaultView(), false);
    } else {
      setView(defaultView(), false);
    }
  }

  function bindGestures() {
    const stage = view.stage, slop = mapCfg().tapSlop || 6;
    const pts = new Map();          // pointerId -> posisi terakhir (relatif terhadap kotak peta)
    let down = null;                // ketukan yang sedang dipantau: { x, y, moved }
    let lastTap = null, suppressClick = false;

    stage.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      cancelAnim();
      pts.set(e.pointerId, relPoint(e));
      if (pts.size === 1) { down = { x: e.clientX, y: e.clientY, moved: false, id: e.pointerId }; suppressClick = false; }
      else { if (down) down.moved = true; suppressClick = true; }   // jari kedua = pinch, bukan ketukan
    });

    stage.addEventListener('pointermove', function (e) {
      if (!pts.has(e.pointerId)) return;
      const prev = pts.get(e.pointerId), cur = relPoint(e);
      if (pts.size >= 2) {
        const before = Array.from(pts.values());
        pts.set(e.pointerId, cur);
        const after = Array.from(pts.values());
        setView(VP.pinch(view.cur, before[0], before[1], after[0], after[1], view.ctx), true);
        return;
      }
      if (down && !down.moved) {
        if (Math.hypot(e.clientX - down.x, e.clientY - down.y) < slop) return;   // masih ketukan
        down.moved = true; suppressClick = true;
        try { stage.setPointerCapture(e.pointerId); } catch (err) { /* abaikan */ }
        stage.classList.add('dragging');
        // Selisih dihitung dari titik sentuh awal supaya tidak ada lompatan sebesar ambang.
        prev.x = down.x - stage.getBoundingClientRect().left; prev.y = down.y - stage.getBoundingClientRect().top;
      }
      pts.set(e.pointerId, cur);
      if (down && down.moved) setView(VP.panBy(view.cur, cur.x - prev.x, cur.y - prev.y, view.ctx), true);
    });

    function release(e) {
      if (!pts.has(e.pointerId)) return;
      pts.delete(e.pointerId);
      if (pts.size >= 1) { if (down) down.moved = true; return; }   // satu jari lepas: sisa jari lanjut menggeser
      try { stage.releasePointerCapture(e.pointerId); } catch (err) { /* abaikan */ }
      stage.classList.remove('dragging');
      const wasTap = down && !down.moved && e.type === 'pointerup';
      down = null;
      if (!wasTap) { lastTap = null; return; }
      // Ketuk dua kali di laut atau daratan kosong: zoom 2x (atau kembali ke tampilan awal bila sudah mentok).
      if (e.target.closest && e.target.closest('.island, .bubble')) { lastTap = null; return; }
      const now = performance.now(), p = relPoint(e);
      if (lastTap && now - lastTap.t < 320 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 30) {
        lastTap = null;
        const lim = VP.limits(view.ctx);
        animateTo(view.cur.scale >= lim.max * 0.95 ? defaultView() : VP.zoomAt(view.cur, 2, p.x, p.y, view.ctx));
      } else lastTap = { t: now, x: p.x, y: p.y };
    }
    stage.addEventListener('pointerup', release);
    stage.addEventListener('pointercancel', release);
    stage.addEventListener('lostpointercapture', function (e) { if (pts.has(e.pointerId)) release({ pointerId: e.pointerId, type: 'pointercancel', target: stage }); });

    // Klik yang datang setelah geseran atau pinch ditelan di fase capture, sebelum sampai ke penangan klik pulau di main.js.
    stage.addEventListener('click', function (e) {
      if (suppressClick) { suppressClick = false; e.stopPropagation(); e.preventDefault(); }
    }, true);

    // Roda mouse atau trackpad: zoom ke arah kursor. Bila sudah paling jauh dan pemain menggulung ke bawah,
    // biarkan halaman yang menggulung (jangan menjebak roda mouse).
    stage.addEventListener('wheel', function (e) {
      if (!view.cur) return;
      const lim = VP.limits(view.ctx);
      if (e.deltaY > 0 && !e.ctrlKey && view.cur.scale <= lim.min * 1.001) return;
      e.preventDefault();
      cancelAnim();
      const dy = e.deltaY * (e.deltaMode === 1 ? 16 : (e.deltaMode === 2 ? 300 : 1));
      const p = relPoint(e);
      setView(VP.zoomAt(view.cur, Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0016)), p.x, p.y, view.ctx), true);
    }, { passive: false });

    // Pemain keyboard: pulau yang menerima fokus lewat Tab digeser ke tengah. Fokus karena klik mouse diabaikan
    // (peta tidak boleh bergerak di bawah jari sebelum klik selesai).
    stage.addEventListener('focusin', function (e) {
      const isl = e.target.closest && e.target.closest('.island');
      if (isl && e.target.matches && e.target.matches(':focus-visible')) focus(isl.getAttribute('data-region'));
    });
    // Browser kadang menggulung kotak overflow saat elemen di dalamnya difokus; peta tidak boleh bergeser dengan cara itu.
    stage.addEventListener('scroll', function () { stage.scrollLeft = 0; stage.scrollTop = 0; });
  }

  function buildControls(card) {
    const box = document.createElement('div');
    box.className = 'map-zoom';
    box.innerHTML =
      '<button type="button" class="mz-btn" data-mz="in" aria-label="Perbesar peta">+</button>' +
      '<button type="button" class="mz-btn" data-mz="out" aria-label="Perkecil peta">\u2212</button>' +
      '<button type="button" class="mz-btn" data-mz="reset" aria-label="Kembalikan tampilan peta">\u2316</button>';
    card.appendChild(box);
    const rl = document.createElement('div');
    rl.className = 'map-ruler'; rl.setAttribute('aria-hidden', 'true');
    rl.innerHTML = '<span class="mr-txt"></span><span class="mr-bar"></span>';
    view.stage.appendChild(rl);
    view.ruler = { bar: rl.querySelector('.mr-bar'), txt: rl.querySelector('.mr-txt') };
    view.btn.in = box.querySelector('[data-mz="in"]');
    view.btn.out = box.querySelector('[data-mz="out"]');
    box.addEventListener('click', function (e) {
      const b = e.target.closest('[data-mz]');
      if (!b || b.disabled) return;
      const k = b.getAttribute('data-mz');
      if (k === 'in') zoomButton(1.6); else if (k === 'out') zoomButton(1 / 1.6); else animateTo(defaultView());
    });
  }

  function mountView(host) {
    view.stage = host.closest('.map-scroll');
    view.svg = host.querySelector('.map-svg');
    if (!view.stage || !view.svg || !VP) return;
    const grid = NT.raster.grid();
    const world = { w: grid.W * S, h: grid.H * S };
    view.stage.style.setProperty('--map-ar', world.w + ' / ' + world.h);
    const c = mapCfg();
    view.ctx = { world: world, box: { w: 0, h: 0 }, maxZoom: c.maxZoom || 4, maxPx: c.maxPx || 0 };
    buildControls(view.stage.parentNode);
    bindGestures();
    if (window.ResizeObserver) new ResizeObserver(onResize).observe(view.stage);
    else window.addEventListener('resize', onResize);
    onResize();
    window.addEventListener('pagehide', function () { if (view.saveTimer) saveNow(); });
  }

  // Geser (dan bila perlu perbesar sedikit) peta supaya wilayah terpilih berada di tengah kotak.
  function focus(regionId) {
    const r = D.regions[regionId];
    if (!r || !view.cur) return;
    const p = pt(r.map.pin), lim = VP.limits(view.ctx);
    // Di HP (peta "pas layar" terlalu kecil) jangan biarkan pulau terpilih terlihat sekecil itu; di desktop zoom tidak diubah.
    const phone = VP.fitScale(view.ctx) < (mapCfg().fitMinPx || 0.5);
    const comfy = phone ? Math.min(lim.max, mapCfg().startPx || 0.81) : 0;
    animateTo(VP.centerOn(view.cur, p.x, p.y, view.ctx, Math.max(view.cur.scale, comfy)));
  }

  NT.ui.map = {
    mount: function () {
      const host = document.getElementById('map');
      if (host) { host.innerHTML = build(); NT.ui.terrain.attach(host); mountView(host); }
    },
    update: update,
    tickJobs: tickJobs,
    focus: focus
  };
})((window.NT = window.NT || {}));

</script>
  <script>
/*
 * Panel antarmuka: wilayah, pasar, info. Render penuh dilakukan setelah aksi pemain;
 * tiap detik hanya angka bertanda data-live yang diperbarui (supaya tombol tidak "berkedip").
 */
(function (NT) {
  NT.ui = NT.ui || {};
  const D = NT.data;
  const E = NT.economy;
  const F = NT.fmt;

  const view = { tab: 'map', region: 'jawa', market: 'jawa', resetArmed: false, sheet: false, guideOpen: false };

  function $(id) { return document.getElementById(id); }

  // Istilah yang bisa diketuk untuk melihat penjelasannya (aksi "term").
  const GLOSSARY = {
    ongkir: 'Ongkir: biaya kirim per satuan barang bila dijual di wilayah lain. Makin jauh dan makin berat barangnya, makin mahal. Pelabuhan menurunkannya.',
    paceklik: 'Paceklik: masa panen sedikit. Produksi turun, tetapi harga biasanya naik.',
    raya: 'Panen raya: masa hasil berlimpah. Produksi naik, tetapi harga cenderung tertekan.',
    peradaban: 'Skor peradaban: dihitung dari level bangunan, infrastruktur, wilayah yang terbuka, dan total pendapatan. Makin tinggi, makin besar gelarmu.',
    tekanan: 'Tekanan pasar: menjual banyak barang sekaligus menurunkan harga di pasar itu, lalu pulih pelan-pelan. Sebar penjualan ke beberapa pasar.',
    tol: 'Jalan tol: menaikkan produksi semua bangunan di wilayah itu 20% per level.',
    pelabuhan: 'Pelabuhan: memotong ongkir kirim antar wilayah. Pelabuhan di asal dan tujuan sama-sama berpengaruh.'
  };

  function term(label, key) {
    return '<button type="button" class="term" data-action="term" data-term="' + key + '">' + label + '</button>';
  }

  /* ---------- Panel wilayah ---------- */

  function jobBox(job, note) {
    return '<div class="bar job"><i data-live="jobbar" data-key="' + job.key + '"></i></div>' +
      '<small>🔨 <b data-live="jobtime" data-key="' + job.key + '"></b> · ' + note + '</small>';
  }

  function speedBtn(job, now) {
    const cost = E.speedupCost(job, now);
    return '<button class="btn primary" data-action="speedup" data-key="' + job.key + '" data-cost="' + cost + '">⚡ Percepat · ' +
      '<span data-live="speedcost" data-key="' + job.key + '">' + F.money(cost) + '</span></button>';
  }

  function buildingRow(state, id, now) {
    const b = D.buildings[id];
    const c = D.commodities[b.produces];
    const lvl = E.buildingLevel(state, id);
    const cost = E.buildingCost(id, lvl);
    const rate = E.productionRate(state, id, now);
    const job = E.jobFor(state, 'b:' + id);
    const dur = E.buildDuration(id, lvl);
    const time = dur ? ' · ⏱ ' + F.short(dur) : '';

    if (!lvl) {
      if (job) {
        return '' +
        '<div class="row building">' +
          '<div class="row-icon working">' + (NT.ui.art.sprite(b.id) || b.icon) + '</div>' +
          '<div class="row-main"><b>Membangun ' + b.name + '…</b>' + jobBox(job, 'lalu ' + F.num(b.baseRate, 1) + '/menit') + '</div>' +
          '<div class="row-actions">' + speedBtn(job, now) + '</div>' +
        '</div>';
      }
      return '' +
      '<div class="row">' +
        '<div class="row-icon">' + (NT.ui.art.sprite(b.id) || b.icon) + '</div>' +
        '<div class="row-main"><b>' + b.name + '</b>' +
          '<small>Menghasilkan ' + c.name + ' (' + F.num(b.baseRate, 1) + '/menit pada Lv 1)</small></div>' +
        '<div class="row-actions">' +
          '<button class="btn primary" data-action="upgrade-building" data-id="' + id + '" data-cost="' + cost + '">Bangun · ' + F.money(cost) + time + '</button>' +
        '</div>' +
      '</div>';
    }

    const cap = E.capacity(state, id, now);
    return '' +
    '<div class="row' + (job ? ' building' : '') + '">' +
      '<div class="row-icon working">' + (NT.ui.art.sprite(b.id) || b.icon) + '</div>' +
      '<div class="row-main">' +
        '<b>' + b.name + ' <span class="lvl">Lv ' + lvl + '</span>' + (job ? ' <span class="lvl next">→ Lv ' + job.to + '</span>' : '') + '</b>' +
        '<small>' + F.num(rate, 2) + ' ' + c.name.toLowerCase() + '/menit <span data-live="bmult" data-id="' + id + '"></span></small>' +
        '<div class="bar"><i data-live="bar" data-id="' + id + '"></i></div>' +
        '<small><span data-live="pending" data-id="' + id + '">0</span> / ' + F.num(cap) + ' siap dikumpulkan</small>' +
        (job ? jobBox(job, 'naik ke Lv ' + job.to) : '') +
      '</div>' +
      '<div class="row-actions">' +
        '<button class="btn" data-action="collect" data-id="' + id + '">Kumpulkan</button>' +
        (job ? speedBtn(job, now)
             : '<button class="btn primary" data-action="upgrade-building" data-id="' + id + '" data-cost="' + cost + '">⬆ ' + F.money(cost) + time + '</button>') +
      '</div>' +
    '</div>';
  }

  function infraRow(state, regionId, infraId, now) {
    const inf = D.infra[infraId];
    const lvl = E.infraLevel(state, regionId, infraId);
    const maxed = lvl >= inf.maxLevel;
    const cost = maxed ? 0 : E.infraCost(regionId, infraId, lvl);
    const job = E.jobFor(state, 'i:' + regionId + ':' + infraId);
    const dur = maxed ? 0 : E.infraDuration(regionId, lvl);
    return '' +
    '<div class="row' + (job ? ' building' : '') + '">' +
      '<div class="row-icon' + (job ? ' working' : '') + '">' + (NT.ui.art.sprite(inf.id) || inf.icon) + '</div>' +
      '<div class="row-main"><b>' + inf.name + ' <span class="lvl">Lv ' + lvl + '/' + inf.maxLevel + '</span>' +
        (job ? ' <span class="lvl next">→ Lv ' + job.to + '</span>' : '') + '</b>' +
        '<small>' + inf.desc + '</small>' + (job ? jobBox(job, 'naik ke Lv ' + job.to) : '') + '</div>' +
      '<div class="row-actions">' +
        (maxed
          ? '<span class="maxed">MAKS</span>'
          : (job ? speedBtn(job, now)
                 : '<button class="btn primary" data-action="upgrade-infra" data-region="' + regionId + '" data-id="' + infraId + '" data-cost="' + cost + '">⬆ ' + F.money(cost) +
                   (dur ? ' · ⏱ ' + F.short(dur) : '') + '</button>')) +
      '</div>' +
    '</div>';
  }

  function renderRegion(state, now) {
    const r = D.regions[view.region];
    const host = $('region-panel');
    let html = '';

    if (r.comingSoon) {
      html = '<div class="card"><h2>' + regionArt(r) + ' ' + r.name + '</h2><p class="muted">' + r.tagline +
        '. Wilayah ini disiapkan sebagai kerangka untuk pengembangan berikutnya.</p></div>';

      const list = r.buildings.map(function (bid) {

      }).join('');
      html = '<div class="card"><h2>🔒 ' + r.name + '</h2><p class="muted">' + r.tagline + '</p>' +
        '<ul class="plain">' + list + '</ul>' +

        '<button class="btn primary wide" data-action="unlock" data-id="' + r.id + '" data-cost="' + r.unlockCost + '">Buka wilayah · ' + F.money(r.unlockCost) + '</button></div>';
    } else {
      html = '<div class="card"><h2>' + regionArt(r) + ' ' + r.name + '</h2><p class="muted">' + r.tagline + '</p>' +
        '<h3>Produksi</h3>' + r.buildings.map(function (bid) { return buildingRow(state, bid, now); }).join('') +
        '<h3>Infrastruktur</h3>' + Object.keys(D.infra).map(function (iid) { return infraRow(state, r.id, iid, now); }).join('') +

  // Daftar pengiriman yang sedang berjalan (penjualan antar pulau dan ekspor).
  function shipmentsHtml(state) {
    const list = state.shipments || [];
    if (!list.length) return '';
    const rows = list.slice().sort(function (a, b) { return a.endsAt - b.endsAt; }).map(function (x) {
      const c = D.commodities[x.commodity];
      const dest = x.kind === 'export' ? D.exportMarkets[x.market].icon + ' ' + D.exportMarkets[x.market].name : D.regions[x.market].name;
      return '<div class="row"><div class="row-main"><b>' + (x.kind === 'export' ? '🚢' : (x.local ? '🚚' : '⛴️')) + ' ' + F.num(x.qty) + ' ' + c.name + ' → ' + dest + '</b>' +
        '<div class="bar job"><i data-live="shipbar" data-id="' + x.id + '"></i></div>' +
        '<small>Tiba dalam <b data-live="shiptime" data-id="' + x.id + '"></b> · bayaran <b>' + F.money(x.net) + '</b></small></div></div>';
    }).join('');
    return '<div class="card"><h2>Pengiriman <small class="muted">kapal ' + E.slotsUsed(state) + '/' + E.shipSlots(state) + '</small></h2>' + rows + '</div>';
  }

  // Lencana kelas ekspor: 🌍 bebas, 🔒 terbatas, 🏠 domestik.
  function exportBadge(cid) {
    const cls = E.exportClassOf(cid);
    const t = { bebas: ['🌍 Ekspor', 'Boleh diekspor'], terbatas: ['🔒 Terbatas', 'Ekspor dengan syarat'], domestik: ['🏠 Domestik', 'Tidak bisa diekspor'] }[cls];
    return '<span class="tag xc-' + cls + '" title="' + t[1] + '">' + t[0] + '</span>';
  }

  // Penjelasan singkat aturan 'terbatas' untuk satu komoditas.
  function exportRuleText(cid) {
    const c = D.commodities[cid], rule = c.exportRule || {};
    const parts = [];
    if (rule.quotaPct) parts.push(Math.round(rule.quotaPct * 100) + '% tiap kiriman wajib dijual di dalam negeri (DMO)');
    if (rule.needBuilding) parts.push('butuh ' + ((D.buildings[rule.needBuilding] || {}).name || rule.needBuilding));
    return parts.join(' · ');
  }

  // Ekspor ke luar negeri: makin jauh makin lama, tetapi harga lebih tinggi.
  function exportHtml(state, now) {
    const markets = Object.keys(D.exportMarkets || {}).map(function (mid) {
      const m = D.exportMarkets[mid];
      const rows = Object.keys(D.commodities).filter(function (cid) {
        return Math.floor(state.inventory[cid] || 0) >= 1 && E.exportClassOf(cid) !== 'domestik';
      }).map(function (cid) {
        const c = D.commodities[cid];
        const have = Math.floor(state.inventory[cid]);
        const port = state.regions[c.region] ? state.regions[c.region].infra.pelabuhan : 0;
        const st = E.exportStatus(state, cid);
        const portOk = port >= m.minPort;
        const ok = st.ok && portOk;
        const qty = Math.min(have, Math.max(1, E.exportMaxQty(state, cid)));
        const plan = E.exportPlan(cid, qty);
        const q = ok && plan.exportQty >= 1 ? E.quoteExport(state, cid, mid, plan.exportQty, now) : null;
        let info;
        if (!st.ok) info = '🔒 ' + st.reason;
        else if (!portOk) info = '🔒 butuh Pelabuhan ' + D.regions[c.region].name + ' level ' + m.minPort;
        else if (!q) info = 'jumlah terlalu sedikit setelah kuota dalam negeri';
        else info = 'kirim ' + F.num(plan.exportQty) + (plan.dmoQty ? ' (+' + F.num(plan.dmoQty) + ' wajib dalam negeri)' : '') +
          ' · bersih ' + F.money(q.net) + ' · tiba ' + F.short(q.durationMs);
        return '<div class="row"><div class="row-main"><b>' + c.name + exportBadge(cid) + '</b>' +
          '<small>' + info + '</small></div>' +
          '<button class="btn' + (ok && q ? ' primary' : '') + '" data-action="ship-export" data-c="' + cid + '" data-x="' + mid + '"' + (ok && q ? '' : ' disabled') + '>🚢 Ekspor</button></div>';
      }).join('');
      return '<div class="goods"><div class="goods-head"><div class="row-icon">' + m.icon + '</div>' +
        '<div class="row-main"><b>' + m.name + '</b><small>±' + F.short(m.baseHours * 3600000) + ' di laut · butuh Pelabuhan level ' + m.minPort + '</small></div></div>' +
        (rows || '<small class="muted">Gudang kosong.</small>') + '</div>';
    }).join('');
    const notes = Object.keys(D.commodities).filter(function (cid) { return E.exportClassOf(cid) !== 'bebas'; }).map(function (cid) {
      const c = D.commodities[cid];
      const txt = E.exportClassOf(cid) === 'domestik' ? 'tidak bisa diekspor; jual ke pasar pulau lain.' : exportRuleText(cid) + '.';
      return '<li><b>' + c.name + '</b>' + exportBadge(cid) + ' ' + txt + '</li>';
    }).join('');
    return '<div class="card"><h2>Ekspor luar negeri</h2>' +
      '<p class="muted small">Harga jual lebih tinggi daripada di dalam negeri, tetapi barang butuh waktu di laut dan hanya bisa dikirim sebanyak muatan kapal (naik bersama level pelabuhan). Uang masuk saat barang tiba.</p>' +
      '<p class="muted small">🌍 Ekspor = bebas · 🔒 Terbatas = ada syarat · 🏠 Domestik = kebutuhan dalam negeri. Aturan ini penyederhanaan untuk game.</p>' +
      (notes ? '<ul class="xc-notes small muted">' + notes + '</ul>' : '') + markets + '</div>';
  }

    $('tab-market').innerHTML = shipmentsHtml(state) +

      '<p class="muted small">Harga mengikuti musim panen dan peristiwa dunia, naik turun sendiri, dan jatuh bila kamu menjual terlalu banyak di satu pasar. ' +
      'Ongkir dihitung dari berat dan jarak laut sebenarnya: barang curah murah (padi) paling terasa ongkirnya; pelabuhan menurunkannya. ' +
      'Penjualan butuh waktu kirim: harga dikunci saat berangkat dan uang masuk saat barang tiba.</p></div>' + goods + exportHtml(state, now);
  }

  // Grafik mini harga: 30 menit lalu sampai 30 menit ke depan (garis putus-putus = perkiraan).
  function sparkSvg(state, cid, now) {
    const W = 240, H = 46, PAD = 4;
    const ser = E.priceSeries(state, view.market, cid, now, 30, 30, 40);
    const base = E.normalPrice(view.market, cid);
    let lo = base, hi = base;
    ser.forEach(function (p) { lo = Math.min(lo, p.price); hi = Math.max(hi, p.price); });
    const span = (hi - lo) || 1;
    function x(i) { return (i / (ser.length - 1) * W).toFixed(1); }
    function y(v) { return (PAD + (1 - (v - lo) / span) * (H - 2 * PAD)).toFixed(1); }
    const mid = ser.length >> 1;
    const past = ser.slice(0, mid + 1).map(function (p, i) { return x(i) + ',' + y(p.price); }).join(' ');
    const fut = ser.slice(mid).map(function (p, i) { return x(i + mid) + ',' + y(p.price); }).join(' ');
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Grafik harga">' +
      '<line class="sp-base" x1="0" x2="' + W + '" y1="' + y(base) + '" y2="' + y(base) + '"/>' +
      '<line class="sp-now" x1="' + x(mid) + '" x2="' + x(mid) + '" y1="0" y2="' + H + '"/>' +
      '<polyline class="sp-past" points="' + past + '"/>' +
      '<polyline class="sp-fut" points="' + fut + '"/>' +
      '<circle class="sp-dot" cx="' + x(mid) + '" cy="' + y(ser[mid].price) + '" r="3.2"/></svg>';
  }

  /* ---------- Panduan awal ---------- */

  function renderGuide(state) {
    const host = $('guide');
    if (!host) return;
    const g = NT.achievements.guide(state);
    if (state.guideHidden || g.complete) { host.innerHTML = ''; return; }
    const open = view.guideOpen;
    const list = g.steps.map(function (x) {
      const cur = g.current && g.current.id === x.id;
      return '<li class="' + (x.done ? 'done' : (cur ? 'cur' : '')) + '"><span class="gk">' + (x.done ? '✅' : (cur ? '👉' : '⬜')) + '</span>' +
        '<span><b>' + x.icon + ' ' + x.title + '</b>' + (cur ? '<small>' + x.hint + '</small>' : '') + '</span></li>';
    }).join('');
    host.innerHTML =
      '<div class="guide' + (open ? ' open' : '') + '">' +
        '<button class="guide-head" data-action="guide-toggle" aria-expanded="' + open + '">' +
          '<span class="guide-ico">🎓</span>' +
          '<span class="guide-text"><small>Panduan awal · ' + g.done + '/' + g.total + '</small><b>' + g.current.title + '</b></span>' +
          '<span class="guide-caret" aria-hidden="true">' + (open ? '▴' : '▾') + '</span>' +
        '</button>' +
