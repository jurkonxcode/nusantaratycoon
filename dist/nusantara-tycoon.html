<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d4f">
  <title>Nusantara Tycoon</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="description" content="Bangun kerajaan dagang dari Sabang sampai Merauke.">
  <meta property="og:title" content="Nusantara Tycoon">
  <meta property="og:description" content="Bangun kerajaan dagang dari Sabang sampai Merauke.">
  <meta property="og:image" content="assets/social/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <style>
/* Nusantara Tycoon: tema laut tropis dengan aksen emas batik. */

:root {
  --sea-950: #051f2a;
  --sea-900: #062c3b;
  --sea-800: #0b3d4f;
  --sea-700: #0f566b;
  --sea-500: #1a8a9c;
  --page: #f3eee2;
  --sand: #f6ecd7;
  --sand-dark: #e8d9b8;
  --line: #e4dac3;
  --ink: #1b2a2f;
  --muted: #5d6e73;
  --gold: #d9a441;
  --gold-dark: #a8751c;
  --green: #2f8f4e;
  --red: #c0453a;
  --card: #fffdf7;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(6, 44, 59, .08), 0 8px 24px rgba(6, 44, 59, .08);
  --shadow-sm: 0 1px 2px rgba(6, 44, 59, .1);
  --gap: 16px;
}

* { box-sizing: border-box; }

html, body { margin: 0; }

body {
  font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  color: var(--ink);
  background: var(--page);
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
}

/* Pita batik di atas halaman */
.batik-strip {
  height: 10px;
  background:
    radial-gradient(circle at 50% 50%, var(--gold) 0 2px, transparent 3px) 0 0 / 14px 10px,
    linear-gradient(90deg, #6b3b17, #8a4f1f, #6b3b17);
}

.wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
#app { padding-bottom: 48px; }

/* Kepala halaman: pita laut penuh lebar berisi merek, angka, dan tab */
.masthead {
  background: linear-gradient(180deg, var(--sea-900), var(--sea-800));
  border-bottom: 1px solid rgba(255, 255, 255, .08);
  box-shadow: 0 4px 16px rgba(6, 44, 59, .18);
  margin-bottom: var(--gap);
}
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 16px 0 12px; color: #fff;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-logo { font-size: 32px; line-height: 1; }
.brand h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 22px; letter-spacing: .2px; line-height: 1.15; }
.brand p { margin: 3px 0 0; font-size: 13px; color: var(--gold); font-weight: 700; }
.stats { display: flex; gap: 10px; }
.stat {
  background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .16);
  border-radius: 10px; padding: 7px 14px; text-align: right; min-width: 104px;
}
.stat span { display: block; font-size: 12px; opacity: .72; }
.stat b { font-size: 16px; font-variant-numeric: tabular-nums; }

/* Tab: garis bawah emas pada tab aktif */
.tabs { display: flex; gap: 4px; margin: 0; }
.tab {
  border: 0; padding: 12px 18px 11px; font: inherit; font-weight: 700; font-size: 14px;
  color: #b9d6de; background: transparent; cursor: pointer; border-bottom: 3px solid transparent;
  border-radius: 8px 8px 0 0; transition: color .15s, background .15s;
}
.tab:hover { color: #fff; background: rgba(255, 255, 255, .06); }
.tab.on { color: #fff; border-bottom-color: var(--gold); background: rgba(255, 255, 255, .08); }
.tab.mini { margin-left: auto; padding-left: 14px; padding-right: 14px; }

.tab-panel { display: none; }
.tab-panel.on { display: block; }

/* Tata letak tab Peta: target + banner di atas, peta kiri, panel kanan (desktop) */
.info-row { display: grid; gap: 12px; margin-bottom: 12px; }
.map-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--gap); }
.map-col, .side-col { min-width: 0; }
.side-col .btn.collect-all { margin-top: 0; }
.side-col .card:first-child { margin-top: 12px; }

@media (min-width: 980px) {
  .map-layout { grid-template-columns: minmax(0, 1.65fr) minmax(340px, 1fr); gap: 20px; }
  .map-col { position: sticky; top: 16px; align-self: start; }
}

/* Peta */
.map-card {
  position: relative; border-radius: 16px; overflow: hidden;
  border: 1px solid var(--sea-950); box-shadow: var(--shadow); background: var(--sea-900);
}
.map-card::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  box-shadow: inset 0 0 0 2px rgba(217, 164, 65, .7), inset 0 0 40px rgba(3, 25, 35, .35);
}
.map-scroll { overflow-x: auto; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
.map-svg { display: block; width: 100%; height: auto; }
.sprite, .road { shape-rendering: crispEdges; }
@media (max-width: 759px) { .map-svg { min-width: 760px; } }
.collect-all { box-shadow: var(--shadow-sm); }

/* Laut: bidang datar bertingkat, makin dangkal makin terang */
.px-deep { fill: #0d4c68; }
.px-sea.s1 { fill: #49b3bd; }
.px-sea.s2 { fill: #2a93a8; }
.px-sea.s3 { fill: #167690; }
.graticule { fill: none; stroke: #fff; stroke-opacity: .07; stroke-width: 1; stroke-dasharray: 3 7; shape-rendering: auto; }
.sea-label {
  font: italic 600 13px Georgia, "Times New Roman", serif; letter-spacing: 3px; fill: #bfe6ee; opacity: .42;
  pointer-events: none; shape-rendering: auto;
}
.compass { opacity: .8; pointer-events: none; shape-rendering: auto; }
.cp-ring { fill: rgba(3, 25, 35, .35); stroke: #e8d9b8; stroke-width: 1.5; }
.cp-n { fill: #f0c25f; }
.cp-s { fill: #e8f1f3; opacity: .85; }
.cp-t { font: 700 12px "Segoe UI", system-ui, sans-serif; fill: #f6ecd7; }
.sparkle { fill: #fff; opacity: .12; animation: twinkle 3.4s steps(2, end) infinite; }
.sparkle.b { animation-delay: -1.7s; }
@keyframes twinkle { 50% { opacity: 0; } }

/* Daratan: pantai, dataran, hutan, dataran tinggi */
.px-neighbor { fill: #5d7c66; opacity: .75; }
.px-sand { fill: #f1e3b0; }
.px-grass { fill: #8cc66c; }
.px-forest { fill: #62ab5a; }
.px-dark { fill: #46904c; }
.island-land { filter: drop-shadow(0 2px 0 rgba(3, 25, 35, .45)); }
.island.locked .px-sand { fill: #cfc3a0; }
.island.locked .px-grass { fill: #aab08c; }
.island.locked .px-forest { fill: #97a07f; }
.island.locked .px-dark { fill: #868f70; }
.island.soon .island-land { opacity: .5; }
.island.soon .px-sand { fill: #cfc8b0; }
.island.soon .px-grass { fill: #a3a893; }
.island.soon .px-forest { fill: #939985; }
.island.soon .px-dark { fill: #858b78; }

.island { cursor: pointer; outline: none; }
.island:hover .island-land, .island:focus-visible .island-land { filter: brightness(1.12); }
.island.selected .island-land { filter: drop-shadow(0 0 2px #ffd36b) drop-shadow(0 0 5px #ffd36b); }
.island-tag { pointer-events: none; shape-rendering: auto; }
.label-bg { fill: rgba(5, 31, 42, .72); stroke: rgba(255, 255, 255, .18); stroke-width: 1; }
.island-label { font: 700 16px "Segoe UI", system-ui, sans-serif; fill: #fff; letter-spacing: .2px; }
.island.soon .island-tag { opacity: .7; }
.island.soon .island-label { font-size: 14px; font-weight: 600; }
.island.selected .label-bg { fill: var(--gold); stroke: var(--gold-dark); }
.island.selected .island-label { fill: #2b1c04; }
.road { fill: #5b5f66; }
.ship { pointer-events: none; }

.pin { shape-rendering: auto; }
.pin-dot { fill: #fffaf0; stroke: var(--gold-dark); stroke-width: 3; filter: drop-shadow(0 2px 2px rgba(3, 25, 35, .5)); }
.pin-icon { font-size: 19px; pointer-events: none; }
.island.locked .pin-dot, .island.soon .pin-dot { fill: #d9ddd9; stroke: #7b867e; }
.pin-pulse { fill: none; stroke: var(--gold); stroke-width: 2; opacity: 0; }
.island.selected .pin-pulse { animation: pulse 1.8s ease-out infinite; }
@keyframes pulse {
  0% { r: 17; opacity: .9; }
  100% { r: 34; opacity: 0; }
}

/* Chip wilayah (cara cepat memilih di layar kecil) */
.region-chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px 12px; background: var(--sea-950); scrollbar-width: none; position: relative; z-index: 1; }
.region-chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .08); color: #e3f1f5;
  font: inherit; font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap;
}
.chip.on { background: var(--gold); border-color: var(--gold-dark); color: #3a2605; }
.chip.soon { opacity: .55; }

/* Banner dunia nyata */
.world-banner {
  display: flex; flex-wrap: wrap; gap: 4px 12px; align-content: center; margin: 0; padding: 12px 14px;
  background: var(--sea-700); border: 1px solid rgba(255, 255, 255, .14); border-radius: var(--radius);
  color: #eaf5f8; font-size: 14px; box-shadow: var(--shadow-sm);
}
.world-banner .evt { flex-basis: 100%; color: #ffe29a; font-weight: 700; }
.world-banner .evt.good { color: #b8f0b8; }
.tag { display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 999px; vertical-align: middle; margin-left: 4px; }
.tag.raya { background: #dff3d6; color: #1f6b34; }
.tag.paceklik { background: #fbe3d8; color: #9a3a1a; }
.mult.up { color: var(--green); font-weight: 800; }
.mult.down { color: var(--red); font-weight: 800; }
.cal { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; margin: 4px 0 10px; }
.cal i { display: block; height: 14px; border-radius: 3px; background: #ddd2b6; }
.cal i.hi { background: #6fbf6f; }
.cal i.lo { background: #e7b9a4; }
.cal i.now { outline: 2px solid var(--sea-800); outline-offset: 1px; }
.cal-labels { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; font-size: 9px; text-align: center; color: var(--muted); margin-top: -6px; margin-bottom: 8px; }

/* Kartu dan baris */
.card {
  background: var(--card); border-radius: var(--radius); padding: 18px; margin-top: var(--gap);
  box-shadow: var(--shadow); border: 1px solid var(--line);
}
.card h2 { margin: 0 0 4px; font-family: Georgia, serif; font-size: 21px; color: var(--sea-800); }
.card h3 {
  margin: 20px 0 4px; padding-bottom: 6px; font-size: 14px; font-weight: 700; color: var(--sea-700);
  border-bottom: 2px solid var(--gold);
  display: inline-block; min-width: 40%;
}
.muted { color: var(--muted); }
.small { font-size: 12px; }
p { line-height: 1.45; }

.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
h3 + .row { border-top: 0; }
.row-icon {
  flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px;
  background: linear-gradient(145deg, #fff, var(--sand));
  border: 1px solid var(--sand-dark);
}
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-main small { color: var(--muted); font-size: 12px; }
.row-actions { display: flex; flex-direction: column; gap: 6px; }
.lvl {
  display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 999px;
  background: var(--sea-700); color: #fff; vertical-align: middle;
}
.maxed { font-size: 12px; font-weight: 800; color: var(--green); padding: 0 8px; }

.bar { height: 8px; border-radius: 999px; background: var(--sand-dark); overflow: hidden; margin: 3px 0; }
.bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #6fbf6f, var(--green)); transition: width .9s linear; }
.bar.full i { background: linear-gradient(90deg, var(--gold), var(--gold-dark)); }

/* Tombol */
.btn {
  border: 1px solid var(--sand-dark); background: #fff; color: var(--sea-800);
  font: inherit; font-weight: 700; font-size: 13px; padding: 8px 12px; border-radius: 10px; cursor: pointer;
  white-space: nowrap;
}
.btn.primary { background: linear-gradient(180deg, #f0c25f, var(--gold)); border-color: var(--gold-dark); color: #3a2605; }
.btn.danger { background: #fff; border-color: var(--red); color: var(--red); }
.btn.wide { width: 100%; padding: 12px; font-size: 15px; margin-top: 8px; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: grayscale(.4); }
.btn:focus-visible, .tab:focus-visible, .seg:focus-visible { outline: 3px solid var(--sea-500); outline-offset: 2px; }

ul.plain, ol.plain { margin: 8px 0 0; padding-left: 20px; line-height: 1.7; }
ul.plain { list-style: none; padding-left: 0; }

/* Pasar */
.segs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.seg {
  border: 1px solid var(--sand-dark); background: #fff; padding: 7px 12px; border-radius: 999px;
  font: inherit; font-weight: 700; font-size: 13px; color: var(--sea-800); cursor: pointer;
}
.seg.on { background: var(--sea-700); color: #fff; border-color: var(--sea-700); }

.goods { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-top: 0; box-shadow: var(--shadow); }
#tab-market, #tab-about { max-width: 980px; margin: 0 auto; }
@media (min-width: 760px) {
  #tab-market { display: none; }
  #tab-market.on { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); align-items: start; }
  #tab-market > .card { grid-column: 1 / -1; margin-top: 0; }
}
@media (max-width: 759px) { #tab-market.on > .goods { margin-top: 12px; } }
.goods-head { display: flex; align-items: center; gap: 10px; }
.goods-stock { text-align: right; }
.goods-stock b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.goods-stock small { color: var(--muted); font-size: 11px; }
.goods-price { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; margin: 10px 0 4px; font-size: 14px; }
.goods-best { font-size: 12px; color: var(--sea-700); min-height: 16px; }
.goods-actions { display: flex; gap: 8px; margin-top: 8px; }
.goods-actions .btn { flex: 1; }
.trend { font-size: 12px; font-weight: 800; }
.trend.up { color: var(--green); }
.trend.down { color: var(--red); }

/* Toast */
#toasts {
  position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; z-index: 20; padding: 0 12px;
}
.toast {
  background: var(--sea-900); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: 460px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .35); border-left: 5px solid var(--green); animation: pop .22s ease-out;
}
.toast.warn { border-left-color: var(--gold); }
.toast.out { opacity: 0; transform: translateY(8px); transition: all .45s; }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.96); } }

@media (max-width: 520px) {
  .wrap { padding: 0 14px; }
  .brand h1 { font-size: 17px; }
  .stat { min-width: 72px; padding: 5px 8px; }
  .stat b { font-size: 13px; }
  .tab { flex: 1; padding: 11px 6px 10px; }
  .tab.mini { flex: none; margin-left: 0; }
  .row { flex-wrap: wrap; }
  .row-actions { flex-direction: row; width: 100%; }
  .row-actions .btn { flex: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .sparkle, .pin-pulse, .bar i { animation: none !important; transition: none !important; }
}
.muted-light { opacity: .75; font-weight: 400; }

/* ===== Rasa-main: target, timer pembangunan, efek ===== */

.tab.mini { flex: none; width: 46px; padding: 10px 0; }

/* Kartu target berikutnya */
.goal {
  margin: 0; padding: 14px; border-radius: var(--radius); color: #fff; box-shadow: var(--shadow-sm);
  background: linear-gradient(135deg, var(--sea-700), var(--sea-800)); border: 1px solid rgba(255, 255, 255, .2);
}
.goal-top { display: flex; align-items: center; gap: 10px; }
.goal-ico { font-size: 26px; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .3)); }
.goal-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.goal-text small { font-size: 12px; opacity: .75; }
.goal-text b { font-size: 15px; line-height: 1.3; }
.builders { font-weight: 800; font-size: 13px; background: rgba(255, 255, 255, .14); padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.builders.busy { background: var(--gold); color: #3a2605; }
.goalbar { background: rgba(0, 0, 0, .3); height: 10px; margin: 8px 0 4px; }
.goalbar i { background: linear-gradient(90deg, #ffe08a, var(--gold)); transition: width .6s ease; }
.goal small#goal-eta { font-size: 12px; opacity: .85; }

/* Baris sedang dibangun */
.row.building { background: linear-gradient(90deg, rgba(217, 164, 65, .14), transparent 70%); border-radius: 10px; }
.bar.job { height: 10px; background: #e9dcb8; }
.bar.job i { background: repeating-linear-gradient(-45deg, #f0c25f 0 8px, #d9a441 8px 16px); background-size: 22px 22px; animation: stripes .8s linear infinite; transition: width 1s linear; }
@keyframes stripes { to { background-position: 22px 0; } }
.lvl.next { background: var(--gold); color: #3a2605; }
.row-icon.working { animation: bob 2.4s ease-in-out infinite; }
.row.building .row-icon.working { animation: hammer .7s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-3px); } }
@keyframes hammer { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }

/* Tombol: lebih "empuk" dan berdenyut saat ada hasil siap */
.btn { box-shadow: 0 2px 0 rgba(0, 0, 0, .12); transition: transform .08s, box-shadow .08s, filter .15s; }
.btn.primary { box-shadow: 0 3px 0 var(--gold-dark); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
.btn.ready { animation: ready 1.3s ease-in-out infinite; border-color: var(--green); }
.collect-all.ready { animation: ready 1.3s ease-in-out infinite; }
@keyframes ready { 50% { transform: scale(1.04); filter: brightness(1.12) saturate(1.2); } }

/* Kas */
.stat b.up { animation: cashUp .6s ease-out; }
.stat b.down { animation: cashDown .6s ease-out; }
@keyframes cashUp { 0% { color: #8dff9d; transform: scale(1.18); } 100% { color: #fff; transform: scale(1); } }
@keyframes cashDown { 0% { color: #ff9a8a; } 100% { color: #fff; } }

/* Peta: gelembung hasil siap dan lencana pembangunan */
.bubble { opacity: 0; pointer-events: none; cursor: pointer; transition: opacity .25s; }
.bubble.on { opacity: 1; pointer-events: all; }
.bubble .bob { animation: bobSvg 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes bobSvg { 50% { transform: translateY(-4px); } }
.bubble-bg { fill: #fffaf0; stroke: var(--gold-dark); stroke-width: 2.5; }
.bubble-ico { font-size: 13px; pointer-events: none; }
.jb-bg { fill: rgba(0, 0, 0, .55); }
.jb-fill { fill: #f0c25f; }
.hammer { font-size: 14px; animation: hammerSvg .7s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 90%; }
@keyframes hammerSvg { 0%, 100% { transform: rotate(-14deg); } 50% { transform: rotate(14deg); } }

/* Angka melayang dan confetti */
.floaty {
  position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, 0); font-weight: 900; font-size: 20px;
  color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .55), 0 0 8px rgba(0, 0, 0, .35); animation: floatUp 1.2s ease-out forwards;
}
.floaty.gold { color: #ffe08a; font-size: 24px; }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 8px) scale(.7); } 15% { opacity: 1; transform: translate(-50%, -6px) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -64px) scale(1); } }
.confetti {
  position: fixed; z-index: 30; width: 8px; height: 12px; pointer-events: none; border-radius: 2px;
  animation: burst 1.1s cubic-bezier(.2, .7, .3, 1) forwards;
}
@keyframes burst { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx), calc(var(--dy) + 90px)) rotate(var(--rot)); } }

@media (prefers-reduced-motion: reduce) {
  .row-icon.working, .btn.ready, .collect-all.ready, .bubble .bob, .hammer, .bar.job i, .floaty, .confetti { animation: none !important; }
}

/* Header ringkas di layar sempit: angka kas tidak turun baris */
.stat b { white-space: nowrap; }
@media (max-width: 520px) {
  .brand-logo { font-size: 24px; }
  .brand h1 { font-size: 15px; line-height: 1.15; }
  .stats { gap: 6px; }
}

/* ===== Pengaturan ===== */

#tab-settings { max-width: 720px; margin: 0 auto; }
.set-card { padding-bottom: 8px; }
.set-card h2 { margin-bottom: 2px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
.set-card h2 + .set-row { border-top: 0; }
.set-text { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.set-text b { font-size: 15px; }
.set-text small { color: var(--muted); font-size: 13px; line-height: 1.4; }
.set-ctl { flex: none; }
.set-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
.set-buttons .btn { display: inline-block; }
.segs.mini { margin: 0; justify-content: flex-end; }
.segs.mini .seg { padding: 6px 11px; font-size: 13px; }
.set-danger { display: block; }
.reset-confirm p { margin: 0 0 10px; font-size: 14px; }

/* Tombol geser (toggle) */
.switch {
  position: relative; width: 50px; height: 30px; border-radius: 999px; border: 0; padding: 0; cursor: pointer;
  background: #c9c2ad; transition: background .15s;
}
.switch i {
  position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .15s;
}
.switch.on { background: var(--green); }
.switch.on i { transform: translateX(20px); }
.switch:focus-visible, .seg:focus-visible, label.btn:focus-within { outline: 3px solid var(--sea-500); outline-offset: 2px; }

@media (max-width: 520px) {
  .set-row { flex-direction: column; align-items: stretch; gap: 10px; }
  .set-ctl { align-self: flex-start; }
  .segs.mini { justify-content: flex-start; }
  .set-row:has(> .set-ctl > .switch) { flex-direction: row; align-items: center; }
}

/* Mode hemat animasi dan ukuran teks */
.calm *, .calm *::before, .calm *::after { animation: none !important; transition: none !important; }
.calm .ship, .calm .sparkle { display: none; }
body.text-large main { zoom: 1.12; }
body.text-xlarge main { zoom: 1.25; }

/* ===== Layar sambutan ===== */

.modal-backdrop {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px;
  background: rgba(5, 31, 42, .62); backdrop-filter: blur(2px);
}
.modal {
  width: 100%; max-width: 440px; max-height: calc(100vh - 32px); overflow-y: auto;
  background: var(--card); border-radius: 16px; padding: 22px; border: 1px solid var(--line);
  box-shadow: 0 20px 60px rgba(3, 25, 35, .45);
}
.modal h2 { margin: 0 0 4px; font-family: Georgia, serif; font-size: 23px; color: var(--sea-800); }
.modal h3 { margin: 18px 0 6px; font-size: 14px; color: var(--sea-700); }
.modal p { margin: 4px 0; }
.wb-list { list-style: none; margin: 0; padding: 0; }
.wb-list li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.wb-list li:first-child { border-top: 0; }
.wb-ico { flex: none; width: 32px; text-align: center; font-size: 20px; }
.wb-name { flex: 1; min-width: 0; }
.wb-list b { font-variant-numeric: tabular-nums; color: var(--green); }
.modal-actions { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
.modal-actions .btn.wide { margin-top: 0; }

/* ---------- Paket B: lembar wilayah (HP) ---------- */
.sheet-grab { display: none; }
@media (max-width: 979px) {
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; pointer-events: none; visibility: hidden; transition: visibility 0s .3s; }
  .sheet.open { visibility: visible; transition-delay: 0s; }
  .sheet-box {
    pointer-events: auto; display: flex; flex-direction: column; max-height: 58vh; max-height: 58dvh;
    background: var(--page); border-radius: 18px 18px 0 0; border-top: 2px solid var(--gold);
    box-shadow: 0 -10px 30px rgba(5, 31, 42, .35); transform: translateY(105%);
    transition: transform .3s cubic-bezier(.2, .8, .2, 1); padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet.open .sheet-box { transform: none; }
  .sheet-grab {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; position: relative;
    padding: 18px 16px 8px; cursor: pointer; touch-action: none; user-select: none;
  }
  .sheet-bar { position: absolute; top: 7px; left: 50%; width: 42px; height: 5px; margin-left: -21px; border-radius: 3px; background: var(--sand-dark); }
  .sheet-title { font-weight: 800; color: var(--sea-800); }
  .sheet-x { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--sand); color: var(--sea-800); font-size: 14px; }
  #region-panel { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 0 12px 16px; }
  #region-panel .card { margin-top: 0; box-shadow: none; border: 0; background: transparent; padding: 0 4px; }
  #region-panel .card > h2 { display: none; }
  body.sheet-open main { padding-bottom: 60vh; }
  body.sheet-open #toasts { bottom: auto; top: calc(10px + env(safe-area-inset-top)); }
}
.calm .sheet-box { transition: none; }

/* ---------- Paket B: pasar informatif ---------- */
.sell-everything { margin: 4px 0 8px; }
.sell-everything:disabled { opacity: .55; }
.sig { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
.sig.good { background: #e3f4e8; color: var(--green); }
.sig.low { background: #fbe7e4; color: var(--red); }
.spark { height: 46px; margin-top: 8px; background: var(--sand); border-radius: 8px; overflow: hidden; }
.spark svg { display: block; width: 100%; height: 100%; }
.spark:empty::after { content: ""; display: block; height: 100%; }
.sp-base { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; opacity: .5; vector-effect: non-scaling-stroke; }
.sp-now { stroke: var(--gold-dark); stroke-width: 1; opacity: .5; vector-effect: non-scaling-stroke; }
.sp-past, .sp-fut { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.sp-past { stroke: var(--sea-700); }
.sp-fut { stroke: var(--gold-dark); stroke-dasharray: 4 3; }
.sp-dot { fill: var(--gold); stroke: var(--sea-900); stroke-width: 1; vector-effect: non-scaling-stroke; }
.spark-axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 2px; }
.goods-hint { font-size: 12px; color: var(--gold-dark); min-height: 16px; margin-top: 4px; font-weight: 700; }
.goods-quote { display: block; margin-top: 6px; font-size: 12px; min-height: 14px; }

/* ---------- Paket C: panduan, capaian, istilah ---------- */
#tab-stats { max-width: 980px; margin: 0 auto; }
.toast.info { border-left-color: var(--sea-500); }
.term, .term-tag { font: inherit; cursor: help; }
button.term { background: none; border: 0; padding: 0; color: inherit; font-size: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
button.term-tag { border: 0; text-decoration: underline dotted; text-underline-offset: 2px; }
.term-stat { cursor: help; }
.cheapest { margin-top: 8px; white-space: normal; line-height: 1.3; }
.cheapest[data-none="1"] { opacity: .6; }

.guide { background: var(--card); border: 1px solid var(--gold); border-radius: var(--radius); box-shadow: var(--shadow-sm); margin-bottom: 12px; overflow: hidden; }
.guide-head { display: flex; align-items: center; gap: 10px; width: 100%; background: transparent; border: 0; padding: 10px 14px 6px; font: inherit; text-align: left; cursor: pointer; color: var(--ink); }
.guide-ico { font-size: 22px; }
.guide-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.guide-text small { color: var(--gold-dark); font-weight: 800; font-size: 11px; text-transform: none; }
.guide-text b { font-size: 14px; }
.guide-caret { color: var(--muted); font-size: 14px; }
.guidebar { margin: 0 14px 10px; }
.guide-list { list-style: none; margin: 0; padding: 0 14px 4px; }
.guide-list li { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
.guide-list li small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.guide-list li.done { opacity: .6; }
.guide-list li.done b { text-decoration: line-through; }
.guide-list li.cur { background: #fff7e0; margin: 0 -14px; padding: 8px 14px; }
.guide-foot { padding: 6px 14px 12px; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
@media (min-width: 640px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--sand); border: 1px solid var(--sand-dark); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile-ico { font-size: 18px; }
.tile small { color: var(--muted); font-size: 11px; }
.tile b { font-size: 15px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.card h2 .count { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 800; color: var(--gold-dark); margin-left: 6px; }
.badges { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
@media (min-width: 640px) { .badges { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.badge { border: 1px dashed var(--sand-dark); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px; background: #f3efe4; opacity: .65; min-width: 0; }
.badge.got { opacity: 1; border: 1px solid var(--gold); background: linear-gradient(160deg, #fff9e6, #fff); box-shadow: var(--shadow-sm); }
.badge-ico { font-size: 24px; }
.badge b { font-size: 13px; }
.badge small { color: var(--muted); font-size: 11px; line-height: 1.3; }
.log { list-style: none; margin: 8px 0 0; padding: 0; }
.log li { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
.log li:first-child { border-top: 0; }
.log small { color: var(--muted); font-size: 11px; white-space: nowrap; }
@media (max-width: 520px) { .tab { font-size: 13px; padding-left: 2px; padding-right: 2px; } }

/* Peta realistis: tekstur sudah memuat bayangan, jadi cukup filter warna untuk status pulau. */
.island-land { filter: none; }
.island:hover .island-land, .island:focus-visible .island-land { filter: brightness(1.1); }
.island.locked .island-land { filter: saturate(.3) brightness(1.08); }
.island.locked:hover .island-land { filter: saturate(.45) brightness(1.15); }
.island.soon .island-land { opacity: .55; filter: saturate(.25); }
.island.selected .island-land { filter: drop-shadow(0 0 2px #ffd36b) drop-shadow(0 0 5px #ffd36b); }
.neighbor-land { pointer-events: none; }
img.brand-logo { width: 40px; height: 40px; flex: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
@media (max-width: 759px) { img.brand-logo { width: 32px; height: 32px; } }

/* Ilustrasi SVG sebagai ikon */
.art-ico { display: block; width: 100%; height: 100%; object-fit: contain; }
img.art-ico.sm { display: inline-block; width: 1.5em; height: 1.5em; vertical-align: -.35em; }
.goal-ico .art-ico, .wb-ico .art-ico { width: 30px; height: 30px; margin: 0 auto; }
.art { pointer-events: none; }
.row-icon .art-ico { width: 36px; height: 36px; }

</style>

  <script>
/*
 * Komoditas. Harga game = harga nyata per satuan / config.priceScale.
 * 1 satuan = 1 karung 50 kg (batik: 10 lembar kain, sekitar 4 kg).
 * realRpPerKg adalah PERKIRAAN kasar (2025-2026) untuk menjaga rasio antar komoditas, bukan kurs resmi.
 * Harga komoditas nyata sangat bergejolak; ubah angkanya di sini bila ingin menyesuaikan.
 *   - Padi: acuan pemerintah (HPP gabah kering panen) Rp 6.500/kg.
 *   - Kopi, kakao, cengkeh, karet: kisaran kasar harga tingkat petani/pengepul.
 *
 * season.prod  = pengali produksi per bulan (Jan..Des), season.price = pengali harga per bulan.
 * Tabel dinormalkan di world.js sehingga rata-rata setahun = 1 (musim hanya menggeser waktu, bukan total).
 * marketDepth = berapa unit yang bisa diserap pasar sebelum harga mulai jatuh.
 */
(function (NT) {
  NT.data = NT.data || {};

        state.buildings[j.id] = { level: 1, lastCollected: j.endsAt };
      } else {
        rebase(state, [j.id], j.endsAt, function () { state.buildings[j.id].level = j.to; });
      }
    } else if (j.id === 'tol') {
      rebase(state, D.regions[j.region].buildings, j.endsAt, function () { state.regions[j.region].infra.tol = j.to; });
    } else {
      state.regions[j.region].infra[j.id] = j.to;
    }
  }

  // Selesaikan semua pembangunan yang waktunya habis. Mengembalikan daftar job yang selesai.
  function settle(state, now) {
    const list = jobsOf(state);
    const done = list.filter(function (j) { return j.endsAt <= now; })
      .sort(function (a, b) { return a.endsAt - b.endsAt; });
    if (!done.length) return [];
    state.jobs = list.filter(function (j) { return j.endsAt > now; });
    done.forEach(function (j) { applyJob(state, j); });
    return done;
  }

  function speedupCost(job, now) {
    const total = Math.max(1, job.endsAt - job.startedAt);
    const left = Math.max(0, job.endsAt - now);
    return Math.max(1, Math.ceil(job.cost * C.speedupCostShare * left / total));
  }

  function speedup(state, key, now) {
    const job = jobFor(state, key);
    if (!job) return fail('Pembangunan sudah selesai.');
    const cost = speedupCost(job, now);
    if (state.cash < cost) return fail('Kas belum cukup untuk mempercepat.');
    state.cash -= cost;
    job.endsAt = now;
    settle(state, now);
    return { ok: true, cost: cost, finished: job };
  }

  function builderCheck(state) {
    if (jobsOf(state).length >= C.maxBuilders) {
      return fail('Semua tukang sedang sibuk (' + C.maxBuilders + '). Tunggu salah satu selesai atau percepat.');
    }
    return null;
  }

  function upgradeBuilding(state, buildingId, now) {
    const b = D.buildings[buildingId];
    if (!b) return fail('Bangunan tidak dikenal.');
    if (!state.regions[b.region] || !state.regions[b.region].unlocked) return fail('Wilayah belum dibuka.');

    const key = 'b:' + buildingId;
    if (jobFor(state, key)) return fail('Sedang dalam pembangunan.');
    const lvl = buildingLevel(state, buildingId);
    const cost = buildingCost(buildingId, lvl);
    if (state.cash < cost) return fail('Kas belum cukup.');

    const dur = buildDuration(buildingId, lvl);
    if (dur > 0) {
      const busy = builderCheck(state);
      if (busy) return busy;
      state.cash -= cost;
      jobsOf(state).push({ key: key, kind: 'building', id: buildingId, region: b.region, from: lvl, to: lvl + 1, startedAt: now, endsAt: now + dur, cost: cost });
      stat(state, lvl === 0 ? 'builds' : 'upgrades', 1);
      return { ok: true, cost: cost, level: lvl + 1, built: lvl === 0, queued: true, durationMs: dur };
    }

    gather(state, buildingId, now); // amankan hasil sebelum laju produksi berubah
    state.cash -= cost;
    if (lvl === 0) {
      state.buildings[buildingId] = { level: 1, lastCollected: now };
    } else {
      state.buildings[buildingId].level = lvl + 1;
    }
    stat(state, lvl === 0 ? 'builds' : 'upgrades', 1);
    return { ok: true, cost: cost, level: lvl + 1, built: lvl === 0 };
  }

  function upgradeInfra(state, regionId, infraId, now) {
    const infra = D.infra[infraId];
    const rs = state.regions[regionId];
    if (!infra || !rs) return fail('Infrastruktur tidak dikenal.');
    if (!rs.unlocked) return fail('Wilayah belum dibuka.');

    const key = 'i:' + regionId + ':' + infraId;
    if (jobFor(state, key)) return fail('Sedang dalam pembangunan.');
    const lvl = infraLevel(state, regionId, infraId);
    if (lvl >= infra.maxLevel) return fail('Sudah level maksimum.');
    const cost = infraCost(regionId, infraId, lvl);
    if (state.cash < cost) return fail('Kas belum cukup.');

    const dur = infraDuration(regionId, lvl);
    if (dur > 0) {
      const busy = builderCheck(state);
      if (busy) return busy;
      state.cash -= cost;
      jobsOf(state).push({ key: key, kind: 'infra', id: infraId, region: regionId, from: lvl, to: lvl + 1, startedAt: now, endsAt: now + dur, cost: cost });
      stat(state, 'upgrades', 1);
      return { ok: true, cost: cost, level: lvl + 1, queued: true, durationMs: dur };
    }

    // Tol mengubah laju produksi, jadi amankan hasil semua bangunan di wilayah ini dulu.
    if (infraId === 'tol') {
      D.regions[regionId].buildings.forEach(function (bid) { gather(state, bid, now); });
    }
    state.cash -= cost;
    rs.infra[infraId] = lvl + 1;
    stat(state, 'upgrades', 1);
    return { ok: true, cost: cost, level: lvl + 1 };
  }

  // Perkiraan pemasukan per menit (nilai dasar semua hasil produksi, belum dikurangi ongkir).
  function incomePerMin(state, now) {
    let v = 0;
    Object.keys(state.buildings).forEach(function (id) {
      v += productionRate(state, id, now) * D.commodities[D.buildings[id].produces].basePrice;
    });
    return v;
  }

  // Semua pembelian yang mungkin saat ini: bangun/naikkan bangunan, infrastruktur, dan (opsional) buka wilayah.
  function candidates(state, includeUnlock) {
    const list = [];
    Object.keys(D.regions).forEach(function (rid) {
      const r = D.regions[rid], rs = state.regions[rid];
      if (!rs || r.comingSoon) return;
      if (!rs.unlocked) {
        if (includeUnlock) list.push({ cost: r.unlockCost, label: 'Buka ' + r.name, icon: '🔓', kind: 'unlock', id: rid, region: rid });
        return;
      }
      r.buildings.forEach(function (bid) {
        if (jobFor(state, 'b:' + bid)) return;
        const lvl = buildingLevel(state, bid);
        list.push({ cost: buildingCost(bid, lvl), icon: D.buildings[bid].icon, kind: 'building', id: bid, region: rid,
          label: (lvl ? 'Naikkan ' : 'Bangun ') + D.buildings[bid].name + (lvl ? ' ke Lv ' + (lvl + 1) : '') });
      });
      Object.keys(D.infra).forEach(function (iid) {
        if (jobFor(state, 'i:' + rid + ':' + iid)) return;
        const lvl = infraLevel(state, rid, iid);
        if (lvl >= D.infra[iid].maxLevel) return;
        list.push({ cost: infraCost(rid, iid, lvl), icon: D.infra[iid].icon, kind: 'infra', id: iid, region: rid,
          label: D.infra[iid].name + ' ' + r.name + ' Lv ' + (lvl + 1) });
      });
    });
    return list;
  }

  function cheapest(list) {
    return list.reduce(function (best, c) { return !best || c.cost < best.cost ? c : best; }, null);
  }

  // Target termurah berikutnya, supaya pemain selalu punya tujuan dekat.
  function nextGoal(state) { return cheapest(candidates(state, true)); }

  // Upgrade (bangunan atau infrastruktur) termurah; dipakai tombol "Upgrade termurah".
  function cheapestUpgrade(state) { return cheapest(candidates(state, false)); }

  function unlockRegion(state, regionId) {
    const r = D.regions[regionId];
    const rs = state.regions[regionId];
    if (!r || !rs || r.comingSoon) return fail('Wilayah ini belum tersedia.');
    if (rs.unlocked) return fail('Wilayah sudah terbuka.');
    if (state.cash < r.unlockCost) return fail('Kas belum cukup.');
    state.cash -= r.unlockCost;
    rs.unlocked = true;
    stat(state, 'unlocks', 1);
    return { ok: true, cost: r.unlockCost };
  }

  /* ---------- Pasar ---------- */

  // Tekanan pasokan: naik saat pemain menjual, meluruh seiring waktu.
  function marketStock(state, regionId, commodityId, now) {
    const m = state.market[regionId] && state.market[regionId][commodityId];
    if (!m) return 0;
    const minutes = Math.max(0, (now - m.updatedAt) / 60000);
    return m.stock * Math.exp(-C.marketDecayPerMin * minutes);
  }

  function wave(regionId, commodityId, now) {
    return 1 + C.priceWaveAmplitude * Math.sin(now / (7 * 60000) + hashString(regionId + commodityId));
  }

  // Pengali musim dan peristiwa terhadap harga komoditas (sama di semua pasar).
  function worldPriceMult(commodityId, now) {
    return NT.world.seasonPrice(commodityId, now) * NT.world.eventPrice(commodityId, now);
  }

  // Harga normal (tanpa fluktuasi dan tanpa tekanan pasokan).
  function normalPrice(regionId, commodityId) {
    const demand = (D.regions[regionId].demand && D.regions[regionId].demand[commodityId]) || 1;
    return D.commodities[commodityId].basePrice * demand;
  }

  function unitPrice(regionId, commodityId, stock, now) {
    const depth = D.commodities[commodityId].marketDepth;
    const pressure = stock / (stock + depth);
    return normalPrice(regionId, commodityId) * wave(regionId, commodityId, now) *
      worldPriceMult(commodityId, now) * (1 - C.maxMarketDrop * pressure);
  }

  function currentPrice(state, regionId, commodityId, now) {
    return unitPrice(regionId, commodityId, marketStock(state, regionId, commodityId, now), now);
  }

  // Ongkir per unit dari wilayah asal komoditas ke pasar tujuan:
  // bobot (kg) x jarak (km) x tarif kapal, lalu dikecilkan oleh pelabuhan. Barang curah murah (padi)
  // jadi paling terasa ongkirnya; barang bernilai tinggi (cengkeh, batik) hampir tidak.
  function shippingPerUnit(state, commodityId, marketId) {
    const c = D.commodities[commodityId];
    const km = distanceKm(c.region, marketId);
    if (!km) return 0;
    const ports = infraLevel(state, c.region, 'pelabuhan') + infraLevel(state, marketId, 'pelabuhan');
    const discount = Math.min(C.maxShippingDiscount, ports * C.portDiscountPerLevel);
    const realRp = c.unitKg * km * C.seaFreightRpPerKgKm;
    return realRp / C.priceScale * (1 - discount);
  }

  // Harga bersih per unit saat ini (harga pasar dikurangi ongkir).
  function netUnitPrice(state, commodityId, marketId, now) {
    return currentPrice(state, marketId, commodityId, now) - shippingPerUnit(state, commodityId, marketId);
  }

  function quoteSale(state, commodityId, marketId, qty, now) {
    let stock = marketStock(state, marketId, commodityId, now);
    let revenue = 0;
    for (let i = 0; i < qty; i++) {
      revenue += unitPrice(marketId, commodityId, stock, now);
      stock += 1;
    }
    const shipping = shippingPerUnit(state, commodityId, marketId) * qty;
    return { qty: qty, revenue: revenue, shipping: shipping, net: revenue - shipping };
  }

  function sell(state, commodityId, marketId, qty, now) {
    qty = Math.floor(qty);
    const ms = state.regions[marketId];
    if (!D.commodities[commodityId] || !ms) return fail('Pasar tidak dikenal.');
    if (!ms.unlocked) return fail('Buka wilayah ini dulu untuk berdagang di sana.');
    if (qty < 1) return fail('Tidak ada barang untuk dijual.');
    if ((state.inventory[commodityId] || 0) < qty) return fail('Stok di gudang tidak cukup.');

    const q = quoteSale(state, commodityId, marketId, qty, now);
    if (q.net <= 0) return fail('Harga terlalu rendah, penjualan akan rugi. Coba pasar lain.');

    const stock = marketStock(state, marketId, commodityId, now);
    state.market[marketId][commodityId] = { stock: stock + qty, updatedAt: now };
    state.inventory[commodityId] -= qty;
    state.cash += q.net;
    state.totalEarned += q.net;
    stat(state, 'sales', 1);
    stat(state, 'sold', qty);
    if (q.net > (state.stats.bestSale || 0)) state.stats.bestSale = q.net;
    return { ok: true, qty: qty, revenue: q.revenue, shipping: q.shipping, net: q.net };
  }

  // Jual SEMUA isi gudang
  // ke satu pasar sekaligus. Komoditas yang akan rugi dilewati (dicatat di skipped).
  function sellAll(state, marketId, now) {
    const ms = state.regions[marketId];
    if (!ms) return fail('Pasar tidak dikenal.');
    if (!ms.unlocked) return fail('Buka wilayah ini dulu untuk berdagang di sana.');
    const items = [], skipped = [];
    let net = 0, qty = 0;
    Object.keys(D.commodities).forEach(function (cid) {
      const have = Math.floor(state.inventory[cid] || 0);
      if (have < 1) return;
      const r = sell(state, cid, marketId, have, now);
      if (r.ok) { items.push({ commodity: cid, qty: r.qty, net: r.net }); net += r.net; qty += r.qty; }
      else skipped.push(cid);
    });
    if (!items.length) {
      return fail(skipped.length ? 'Harga di pasar ini terlalu rendah, semua penjualan akan rugi. Coba pasar lain.'
        : 'Gudang kosong, tidak ada yang bisa dijual.');
    }
    return { ok: true, items: items, skipped: skipped, net: net, qty: qty };
  }

  // Perkiraan hasil bersih bila seluruh gudang dijual ke satu pasar (tanpa mengubah state).
  function quoteSellAll(state, marketId, now) {
    let net = 0, qty = 0;
    Object.keys(D.commodities).forEach(function (cid) {
      const have = Math.floor(state.inventory[cid] || 0);
      if (have < 1) return;
      const q = quoteSale(state, cid, marketId, have, now);
      if (q.net > 0) { net += q.net; qty += have; }
    });
    return { net: net, qty: qty };
  }

  // Deret harga untuk grafik mini: dari backMin menit lalu sampai fwdMin menit ke depan.
  // Memakai rumus harga yang sama dengan pasar (gelombang, musim, peristiwa, tekanan jual yang meluruh).
  function priceSeries(state, marketId, commodityId, now, backMin, fwdMin, steps) {
    const out = [];
    const span = (backMin + fwdMin) * 60000;
    for (let i = 0; i <= steps; i++) {
      const t = now - backMin * 60000 + span * i / steps;
      out.push({ t: t, price: unitPrice(marketId, commodityId, marketStock(state, marketId, commodityId, t), t) });
    }
    return out;
  }

  // Isyarat harga: bagus (>= 8% di atas normal), rendah (<= 8% di bawah), atau normal.
  // peakInMin = menit sampai puncak dalam 30 menit ke depan bila lebih tinggi >= 5% dari sekarang.
  function priceSignal(state, marketId, commodityId, now) {
    const cur = currentPrice(state, marketId, commodityId, now);
    const ratio = cur / normalPrice(marketId, commodityId);
    const id = ratio >= 1.08 ? 'bagus' : (ratio <= 0.92 ? 'rendah' : 'normal');
    let peakInMin = null, peak = cur;
    priceSeries(state, marketId, commodityId, now, 0, 30, 30).forEach(function (p) {
      if (p.price > peak) { peak = p.price; peakInMin = Math.round((p.t - now) / 60000); }
    });
    if (peakInMin !== null && peak < cur * 1.05) peakInMin = null;
    return { id: id, ratio: ratio, price: cur, peakInMin: peakInMin, peakPrice: peak };
  }

  // Pasar terbuka dengan harga bersih per unit tertinggi untuk komoditas ini.
  function bestMarket(state, commodityId, now) {
    let best = null;
    Object.keys(state.regions).forEach(function (rid) {
      if (!state.regions[rid].unlocked) return;
      const p = netUnitPrice(state, commodityId, rid, now);
      if (!best || p > best.price) best = { regionId: rid, price: p };
    });
    return best;
  }

  /* ---------- Skor peradaban ---------- */

  function score(state) {
    let s = 0;
    Object.keys(state.buildings).forEach(function (id) { s += state.buildings[id].level * 10; });
    Object.keys(state.regions).forEach(function (rid) {
      const r = state.regions[rid];
      if (r.unlocked && !D.regions[rid].start) s += 100;
      s += ((r.infra.tol || 0) + (r.infra.pelabuhan || 0)) * 25;
    });
    s += Math.floor(state.totalEarned / 1000);
    return s;
  }

  function rank(scoreValue) {
    let current = D.ranks[0];
    let next = null;
    for (let i = 0; i < D.ranks.length; i++) {
      if (scoreValue >= D.ranks[i].min) { current = D.ranks[i]; next = D.ranks[i + 1] || null; }
    }
    return { current: current, next: next };
  }

  NT.economy = {
    distanceKm: distanceKm,
    worldProdMult: worldProdMult,
    worldPriceMult: worldPriceMult,
    buildingLevel: buildingLevel,
    infraLevel: infraLevel,
    productionRate: productionRate,
    capacity: capacity,
    pending: pending,
    collect: collect,
    collectAll: collectAll,
    totalPendingValue: totalPendingValue,
    buildingCost: buildingCost,
    infraCost: infraCost,
    jobFor: jobFor,
    buildDuration: buildDuration,
    infraDuration: infraDuration,
    settle: settle,
    speedup: speedup,
    speedupCost: speedupCost,
    incomePerMin: incomePerMin,
    nextGoal: nextGoal,
    cheapestUpgrade: cheapestUpgrade,
    upgradeBuilding: upgradeBuilding,
    upgradeInfra: upgradeInfra,
    unlockRegion: unlockRegion,
    marketStock: marketStock,
    normalPrice: normalPrice,
    currentPrice: currentPrice,
    shippingPerUnit: shippingPerUnit,
    netUnitPrice: netUnitPrice,
    quoteSale: quoteSale,
    sell: sell,
    sellAll: sellAll,
    quoteSellAll: quoteSellAll,
    priceSeries: priceSeries,
    priceSignal: priceSignal,
    bestMarket: bestMarket,
    score: score,
    rank: rank,
    _fmt: fmt
  };
})((window.NT = window.NT || {}));

</script>
  <script>
/*
 * Panduan awal dan pencapaian. Murni logika (tanpa DOM), hanya membaca state.
 * Syarat diturunkan dari state + statistik, jadi save lama (tanpa statistik) tetap benar.
 */
(function (NT) {
  const D = NT.data;
  const E = NT.economy;

  function sumLevels(state) {
    return Object.keys(state.buildings).reduce(function (a, id) { return a + state.buildings[id].level; }, 0);
  }
  function openRegions(state) {
    return Object.keys(state.regions).filter(function (id) { return state.regions[id].unlocked && !D.regions[id].start; }).length;
  }
  function playable(state) {
    return Object.keys(state.regions).filter(function (id) { return !D.regions[id].comingSoon; });
  }
  function maxInfra(state, infraId) {
    return Object.keys(state.regions).reduce(function (m, id) { return Math.max(m, state.regions[id].infra[infraId] || 0); }, 0);
  }
  function st(state, k) { return (state.stats && state.stats[k]) || 0; }

  /* ---------- Panduan awal: 5 langkah ---------- */

  const STEPS = [
    { id: 'collect', icon: '📦', title: 'Kumpulkan hasil panen',
      hint: 'Ketuk tombol “Kumpulkan semua hasil” di bawah peta.',
      done: function (s) { return st(s, 'collects') > 0 || s.totalEarned > 0; } },
    { id: 'sell', icon: '⚖️', title: 'Jual hasil di tab Pasar',
      hint: 'Buka tab Pasar, lalu ketuk “Jual semua” pada padi.',
      done: function (s) { return st(s, 'sales') > 0 || s.totalEarned > 0; } },
    { id: 'upgrade', icon: '⬆️', title: 'Naikkan level Sawah',
      hint: 'Pilih Jawa di peta, lalu ketuk tombol ⬆ pada Sawah.',
      done: function (s) {
        return st(s, 'upgrades') > 0 || sumLevels(s) > 1 || s.jobs.some(function (j) { return j.kind === 'building' && j.from > 0; });
      } },
    { id: 'build', icon: '🔨', title: 'Bangun bangunan baru',
      hint: 'Bangun Sentra Batik di Jawa untuk komoditas kedua.',
      done: function (s) {
        return st(s, 'builds') > 0 || Object.keys(s.buildings).length > 1 || s.jobs.some(function (j) { return j.kind === 'building' && j.from === 0; });
      } },
    { id: 'unlock', icon: '🔓', title: 'Buka wilayah baru',
      hint: 'Pilih Sumatra di peta dan ketuk “Buka wilayah”.',
      done: function (s) { return st(s, 'unlocks') > 0 || openRegions(s) > 0; } }
  ];

  function guide(state) {
    const steps = STEPS.map(function (x) { return { id: x.id, icon: x.icon, title: x.title, hint: x.hint, done: !!x.done(state) }; });
    const doneCount = steps.filter(function (x) { return x.done; }).length;
    const current = steps.filter(function (x) { return !x.done; })[0] || null;
    return { steps: steps, done: doneCount, total: steps.length, current: current, complete: doneCount === steps.length };
  }

  /* ---------- Pencapaian ---------- */

  const LIST = [
    { id: 'panen', icon: '🌾', name: 'Panen Pertama', desc: 'Kumpulkan hasil panen pertamamu.',
      test: function (s) { return st(s, 'collects') > 0; } },
    { id: 'dagang', icon: '🤝', name: 'Dagang Pertama', desc: 'Jual barang untuk pertama kali.',
      test: function (s) { return st(s, 'sales') > 0; } },
    { id: 'lulus', icon: '🎓', name: 'Lulus Panduan', desc: 'Selesaikan kelima langkah panduan awal.',
      test: function (s) { return guide(s).complete; } },
    { id: 'juragan', icon: '💰', name: 'Juragan Kecil', desc: 'Total pendapatan mencapai Rp 1.000.',
      test: function (s) { return s.totalEarned >= 1000; } },
    { id: 'saudagar', icon: '🪙', name: 'Saudagar', desc: 'Total pendapatan mencapai Rp 25.000.',
      test: function (s) { return s.totalEarned >= 25000; } },
    { id: 'konglomerat', icon: '👑', name: 'Konglomerat Nusantara', desc: 'Total pendapatan mencapai Rp 250.000.',
      test: function (s) { return s.totalEarned >= 250000; } },
    { id: 'lumbung', icon: '🧺', name: 'Lumbung Besar', desc: 'Kumpulkan 1.000 satuan hasil.',
      test: function (s) { return st(s, 'produced') >= 1000; } },
    { id: 'gudang', icon: '🏭', name: 'Gudang Raksasa', desc: 'Kumpulkan 25.000 satuan hasil.',
      test: function (s) { return st(s, 'produced') >= 25000; } },
    { id: 'besar', icon: '💎', name: 'Penjualan Besar', desc: 'Satu kali jual menghasilkan Rp 1.000 atau lebih.',
      test: function (s) { return st(s, 'bestSale') >= 1000; } },
    { id: 'mandor', icon: '🔨', name: 'Mandor Andal', desc: 'Bangun atau naikkan level 10 kali.',
      test: function (s) { return st(s, 'builds') + st(s, 'upgrades') >= 10; } },
    { id: 'arsitek', icon: '📐', name: 'Arsitek Nusantara', desc: 'Bangun atau naikkan level 40 kali.',
      test: function (s) { return st(s, 'builds') + st(s, 'upgrades') >= 40; } },
    { id: 'jelajah', icon: '🧭', name: 'Penjelajah', desc: 'Buka wilayah pertama selain Jawa.',
      test: function (s) { return openRegions(s) >= 1; } },
    { id: 'semua', icon: '🏝️', name: 'Tiga Pulau', desc: 'Buka semua wilayah yang tersedia.',
      test: function (s) { return playable(s).every(function (id) { return s.regions[id].unlocked; }); } },
    { id: 'tol', icon: '🛣️', name: 'Jalan Mulus', desc: 'Bangun jalan tol pertamamu.',
      test: function (s) { return maxInfra(s, 'tol') >= 1; } },

  <script>
/*
 * Driver Supabase (tahap 1: simpan seluruh state sebagai satu baris JSON per pemain).
 * BELUM DIUJI. Langkah mengaktifkan ada di README.md.
 *
 * Catatan keamanan: di tahap ini klien masih bisa mengubah state-nya sendiri.
 * Untuk multiplayer sungguhan, pindahkan aturan di js/core/economy.js
 * (sell, collect, upgrade, unlock) ke Postgres function lalu panggil lewat supabase.rpc().
 */
(function (NT) {
  NT.storageDrivers = NT.storageDrivers || {};

  let client = null;

  function getClient() {
    if (client) return client;
    if (!window.supabase || !window.supabase.createClient) {
      throw new Error('supabase-js belum dimuat. Aktifkan tag script CDN di index.html.');
    }
    const cfg = NT.config.supabase;
    if (!cfg.url || !cfg.anonKey) {
      throw new Error('Isi supabase.url dan supabase.anonKey di js/config.js.');
    }
    client = window.supabase.createClient(cfg.url, cfg.anonKey);
    return client;
  }

  // Masuk anonim dulu (aktifkan "Anonymous sign-ins" di dashboard Supabase).
  // Nanti bisa diganti login email / Google.
  async function userId() {
    const c = getClient();
    const current = await c.auth.getSession();
    let session = current.data.session;
    if (!session) {
      const res = await c.auth.signInAnonymously();
      if (res.error) throw res.error;
      session = res.data.session;
    }
    return session.user.id;
  }

  NT.storageDrivers.supabase = {
    label: 'Tersimpan di cloud (Supabase)',

    async load() {
      const c = getClient();
      const uid = await userId();
      const res = await c.from('game_saves').select('state').eq('user_id', uid).maybeSingle();
      if (res.error) throw res.error;
      return res.data ? res.data.state : null;
    },

    async save(state) {
      const c = getClient();
      const uid = await userId();
      const res = await c.from('game_saves').upsert({
        user_id: uid,
        state: state,
        updated_at: new Date().toISOString()
      });
      if (res.error) throw res.error;
      return true;
    },

    async reset() {
      const c = getClient();
      const uid = await userId();
      const res = await c.from('game_saves').delete().eq('user_id', uid);
      if (res.error) throw res.error;
    }
  };
})((window.NT = window.NT || {}));

(function (NT) {

  function audio() {

    o.frequency.value = freq;

    g.gain.exponentialRampToValueAtTime((vol || 0.05) * volume, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    coin: function () { tone(988, 0, 0.08); tone(1319, 0.07, 0.16); },
    click: function () { tone(440, 0, 0.05, 'triangle', 0.06); },
    start: function () { tone(330, 0, 0.08, 'triangle', 0.07); tone(392, 0.08, 0.12, 'triangle', 0.07); },
    done: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.09, 0.2); }); },
    error: function () { tone(180, 0, 0.16, 'sawtooth', 0.04); }

  function sfx(name) { try { if (SFX[name]) SFX[name](); } catch (e) { /* suara tidak boleh merusak game */ } }

  function toggleMute() {

  function calm() { return document.body.classList.contains('calm'); }

  function setMuted(m) {

    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1300);
  }

  function floatFromRect(rect, text, cls) {

    for (let i = 0; i < 28; i++) {

      p.className = 'confetti';

      p.style.top = y + 'px';

/*
 * Pengaturan pemain (suara, tampilan, permainan). Disimpan di browser ini saja (localStorage),
 * terpisah dari data game, jadi tidak ikut tersimpan di cloud dan tidak mengubah struktur save.
 */
(function (NT) {
  NT.ui = NT.ui || {};
  const KEY = 'nt-settings';

  // Pilihan untuk tiap pengaturan: [nilai, label]. Urutan = urutan tombol di panel.
  const OPTIONS = {
    volume: [['pelan', 'Pelan'], ['sedang', 'Sedang'], ['keras', 'Keras']],
    textSize: [['normal', 'Normal'], ['large', 'Besar'], ['xlarge', 'Sangat besar']],
    confirm: [['off', 'Mati'], ['half', 'Biaya ≥ 50% kas'], ['most', 'Biaya ≥ 80% kas']]
  };
  const VOLUME = { pelan: 0.4, sedang: 1, keras: 1.8 };
  const CONFIRM_FRAC = { off: 0, half: 0.5, most: 0.8 };

  const DEFAULTS = { sfx: true, volume: 'sedang', textSize: 'normal', calm: false, confirm: 'off', compact: true };
  let cfg = Object.assign({}, DEFAULTS);

  function valid(key, val) {
    if (typeof DEFAULTS[key] === 'boolean') return typeof val === 'boolean';
    return !!OPTIONS[key] && OPTIONS[key].some(function (o) { return o[0] === val; });
  }

  function load() {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(KEY)); } catch (e) { /* abaikan */ }
    if (raw && typeof raw === 'object') {
      Object.keys(DEFAULTS).forEach(function (k) { if (valid(k, raw[k])) cfg[k] = raw[k]; });
    } else {
      // Pemain lama: hormati pilihan bisu dari versi sebelumnya.
      try { if (localStorage.getItem('nt-muted') === '1') cfg.sfx = false; } catch (e) { /* abaikan */ }
    }
  }

  function save() { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) { /* abaikan */ } }

  function apply() {
    NT.ui.fx.setMuted(!cfg.sfx);
    NT.ui.fx.setVolume(VOLUME[cfg.volume] || 1);
    NT.fmt.setCompact(cfg.compact);
    const cl = document.body.classList;
    cl.toggle('calm', cfg.calm);
    cl.toggle('text-large', cfg.textSize === 'large');
    cl.toggle('text-xlarge', cfg.textSize === 'xlarge');
  }

  function set(key, raw) {
    const val = raw === 'true' ? true : (raw === 'false' ? false : raw);
    if (!(key in DEFAULTS) || !valid(key, val)) return false;
    cfg[key] = val;
    save();
    apply();
    return true;
  }

  load();
  NT.ui.settings = {
    options: OPTIONS,
    get: function (key) { return cfg[key]; },
    set: set,
    apply: apply,
    // Bagian dari kas yang memicu konfirmasi pembelian (0 = tidak pernah).
    confirmFraction: function () { return CONFIRM_FRAC[cfg.confirm] || 0; }
  };
})((window.NT = window.NT || {}));

/* Sprite pixel art 8x8 untuk bangunan, pelabuhan, dan kapal. Setiap huruf = satu warna, titik = kosong. */
(function (NT) {
  NT.ui = NT.ui || {};

  const COLORS = {
    g: '#2e7343', G: '#6fbf5a', d: '#4a8f3e', y: '#e8c34a', r: '#c8472f', R: '#b8452c', b: '#7a4a24',
    w: '#f4ead2', k: '#2b2f33', p: '#e98aa8', B: '#2d8fd0', o: '#d9822b', m: '#9aa3a8', n: '#c9a24a'
  };

  const SPRITES = {
    sawah: ['...RR...', '..RRRR..', '..bwwb..', '..bwwb..', 'GdGdGdGd', 'dGdGdGdG', 'GdGdGdGd', 'dGdGdGdG'],
    sentra_batik: ['...bb...', '..bbbb..', '.bbbbbb.', 'bbbbbbbb', '.wwwwww.', '.wnwwnw.', '.wwwwww.', '.kkkkkk.'],
    kebun_kopi: ['..GGG...', '.GGrGG..', 'GGGGGrG.', '.GrGGG..', '..GGrG..', '...bb...', '...bb...', '..kbbk..'],
    kebun_karet: ['..GGG...', '.GGGGG..', 'GGGGGGG.', '.GGGGG..', '...bb...', '...bb...', '..mbb...', '..kk....'],
    kebun_kakao: ['..GGG...', '.GGoGG..', 'GGGGGoG.', '.GoGGG..', '..GGoG..', '...bb...', '...bb...', '..kbbk..'],
    kebun_cengkeh: ['..GGG...', '.GpGGp..', 'GGGpGGG.', 'pGGGGpG.', '.GGpGG..', '...bb...', '...bb...', '..kbbk..'],
    pelabuhan: ['....k...', '....k...', '..kkkkk.', '..k..k..', 'ooRRoomm', 'mmmmmmmm', 'BBBBBBBB', 'bBbBbBbB'],
    kapal: ['.....w..', '....ww..', 'kkkkkkk.', '.rrrrr..', '..rrr...', '........', '........', '........']
  };

  // Path SVG untuk sprite, berpusat di (cx, cy), tiap piksel berukuran px satuan.
  function path(name, cx, cy, px, opacity) {
    const rows = SPRITES[name];
    if (!rows) return '';
    const ox = cx - 4 * px, oy = cy - 4 * px;
    const byColor = {};
    rows.forEach(function (row, y) {
      for (let x = 0; x < row.length; x++) {
        const ch = row[x];
        if (ch === '.') continue;
        (byColor[ch] = byColor[ch] || []).push('M' + (ox + x * px) + ' ' + (oy + y * px) + 'h' + px + 'v' + px + 'h-' + px + 'z');
      }
    });
    const parts = Object.keys(byColor).map(function (ch) {
      return '<path fill="' + COLORS[ch] + '" d="' + byColor[ch].join('') + '"/>';
    }).join('');
    return '<g class="sprite"' + (opacity != null ? ' opacity="' + opacity + '"' : '') + '>' + parts + '</g>';
  }

  const A = function () { return NT.assets || { sprite: {}, comm: {} }; };
  NT.ui.art = {
    map: function (name, cx, cy, size, opacity) {
      const src = A().sprite[name];
      if (!src) return path(name, cx, cy, Math.max(1, Math.round(size / 24)), opacity);
      return '<image class="art" href="' + src + '" x="' + (cx - size / 2).toFixed(1) + '" y="' + (cy - size * 0.62).toFixed(1) + '" width="' + size + '" height="' + size + '"' +
        (opacity != null ? ' opacity="' + opacity + '"' : '') + '/>';
    },
    sprite: function (id, cls) { const s = A().sprite[id]; return s ? '<img class="art-ico ' + (cls || '') + '" src="' + s + '" alt="">' : ''; },
    comm: function (id, cls) { const s = A().comm[id]; return s ? '<img class="art-ico ' + (cls || '') + '" src="' + s + '" alt="">' : ''; }
  };

  NT.ui.sprites = { path: path, names: Object.keys(SPRITES) };
})((window.NT = window.NT || {}));

  <script>
/*
 * Peta realistis: garis pantai fraktal (poligon di data/geo.js dikasarkan lalu dihaluskan), peta ketinggian
 * dari punggung gunung + derau, bayangan relief (hillshade), bioma (hutan, sawah Jawa, sabana NTT),
 * laut dengan paparan dangkal (Sunda/Sahul), buih pantai, dan bayangan daratan.
 * Geometri (path) murni dan sinkron; tekstur (canvas) dihitung sekali setelah peta tampil (attach).
 */
(function (NT) {
  NT.ui = NT.ui || {};
  const G = NT.data.geo;
  const K = 2;   // piksel kanvas per satuan viewBox
  const W = Math.ceil((G.lon1 - G.lon0) / G.cellDeg) * G.cellPx;
  const H = Math.ceil((G.lat0 - G.lat1) / G.cellDeg) * G.cellPx;

  /* ---------- Geometri: pantai fraktal ---------- */

  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function roughen(ring, seed) {
    const rnd = rng(seed);
    let pts = ring;
    for (let lvl = 0; lvl < 4; lvl++) {
      const out = [];
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];
        out.push(a);
        const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
        if (len < 0.14) continue;
        const o = Math.max(-0.1, Math.min(0.1, (rnd() * 2 - 1) * len * 0.17));
        out.push([(a[0] + b[0]) / 2 - dy / len * o, (a[1] + b[1]) / 2 + dx / len * o]);
      }
      pts = out;
    }
    return pts;
  }

  function chaikin(p) {
    const out = [];
    for (let i = 0; i < p.length; i++) {
      const a = p[i], b = p[(i + 1) % p.length];
      out.push({ x: 0.75 * a.x + 0.25 * b.x, y: 0.75 * a.y + 0.25 * b.y }, { x: 0.25 * a.x + 0.75 * b.x, y: 0.25 * a.y + 0.75 * b.y });
    }
    return out;
  }

  function toPxRing(ring) { return ring.map(function (q) { return NT.raster.toPx(q[0], q[1]); }); }

  const shapeCache = {};
  // Cincin piksel (halus) untuk satu wilayah.
  function shape(id) {
    if (!shapeCache[id]) {
      const idx = Object.keys(G.polygons).indexOf(id);
      shapeCache[id] = G.polygons[id].map(function (ring, k) {
        return chaikin(toPxRing(roughen(ring, 1000 + idx * 97 + k * 13)));
      });
    }
    return shapeCache[id];
  }

  function pathOf(id) {
    return shape(id).map(function (r) {
      return 'M' + r.map(function (p) { return p.x.toFixed(1) + ' ' + p.y.toFixed(1); }).join('L') + 'Z';
    }).join('');
  }

  function boxOf(id) {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    shape(id).forEach(function (r) {
      r.forEach(function (p) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); });
    });
    x0 = Math.max(0, Math.floor(x0) - 6); y0 = Math.max(0, Math.floor(y0) - 6);
    x1 = Math.min(W, Math.ceil(x1) + 6); y1 = Math.min(H, Math.ceil(y1) + 6);
    return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  }

  function landMarkup(id) {
    const b = boxOf(id);
    return '<path class="ph px-grass" d="' + pathOf(id) + '"/>' +
      '<image data-tex="' + id + '" x="' + b.x + '" y="' + b.y + '" width="' + b.w + '" height="' + b.h + '" preserveAspectRatio="none" clip-path="url(#clip-' + id + ')"/>' +
      '<path d="' + pathOf(id) + '" fill="#000" fill-opacity="0"/>';
  }

  function defs() {
    return '<defs>' + Object.keys(G.polygons).map(function (id) {
      return '<clipPath id="clip-' + id + '"><path d="' + pathOf(id) + '"/></clipPath>';
    }).join('') + '</defs>';
  }

  /* ---------- Data pendukung relief dan laut ---------- */

  // Punggung gunung [bujur, lintang]; HIGH = pegunungan tinggi, MID = sedang.
